<style>
:root{
  color-scheme:light;
  --bg:#F3F6FB; --surface:#FFFFFF; --surface-2:#F8FAFD; --surface-3:#ECF1F8;
  --line:#E1E8F2; --line-2:#C6D3E4;
  --ink:#0E1A2C; --ink-2:#46586F; --ink-3:#7686A0;
  --primary:#1457C9; --primary-2:#0E43A0; --primary-soft:#E3EBFC; --on-primary:#FFFFFF;
  --accent:#E8620A; --accent-soft:#FDEBDC;
  --ok:#0E8558; --ok-soft:#DBF2E8;
  --warn:#B97400; --warn-soft:#FDF0D6;
  --crit:#D02A1E; --crit-soft:#FCE3E1;
  --shadow:0 1px 2px rgba(14,26,44,.05), 0 8px 22px rgba(14,26,44,.07);
  --marca:#9C27B0;
  --r:12px; --r-sm:8px;
  --display:'Familjen Grotesk', 'Trebuchet MS', sans-serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display); margin:0; text-wrap:balance; letter-spacing:-.01em}
button{font-family:inherit; font-size:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1120px; margin:0 auto; padding:10px 16px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0}
.mark{
  width:38px; height:38px; border-radius:50%; flex:none; display:block;
  box-shadow:0 2px 6px rgba(124,24,145,.28);
}
.brand-txt{min-width:0}
.brand-name{display:block; color:var(--marca); font-family:var(--display); font-weight:700; font-size:19px; line-height:1.15; letter-spacing:-.02em}
.brand-sub{display:block; font-size:10.5px; color:var(--ink-3); letter-spacing:.07em; text-transform:uppercase; font-weight:600}
.icon-btn{
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  border-radius:var(--r-sm); padding:7px 11px; font-size:13px; font-weight:500;
  display:inline-flex; align-items:center; gap:6px;
}
.icon-btn:hover{border-color:var(--line-2); color:var(--ink)}

.nav{max-width:1120px; margin:0 auto; padding:0 16px; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  border:0; background:none; color:var(--ink-3); padding:10px 12px 11px;
  font-weight:600; font-size:13.5px; white-space:nowrap;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.nav button[aria-selected="true"]{color:var(--primary); border-bottom-color:var(--primary)}
.nav button:hover{color:var(--ink)}

main{max-width:1120px; margin:0 auto; padding:20px 16px 72px}
.view{display:grid; gap:18px}

/* ---------- generic pieces ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card-pad{padding:16px}
.card-head{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  padding:14px 16px; border-bottom:1px solid var(--line);
}
.card-head h2,.card-head h3{font-size:16px; font-weight:600}
.eyebrow{font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:600; color:var(--ink-3)}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.spacer{flex:1}
.grid-2{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.grid-3{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.btn{
  border:1px solid transparent; border-radius:var(--r-sm); padding:9px 14px;
  font-weight:600; font-size:14px; background:var(--primary); color:var(--on-primary);
  display:inline-flex; align-items:center; gap:7px;
}
.btn:hover{background:var(--primary-2)}
.btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--crit-soft); color:var(--crit); border-color:transparent}
.btn.sm{padding:6px 10px; font-size:13px}
.btn:disabled{opacity:.42; cursor:not-allowed; background:var(--line-2); color:var(--surface)}
.btn.ghost:disabled{background:var(--surface-2); color:var(--ink-3)}

.pill{
  display:inline-flex; align-items:center; gap:5px; border-radius:100px;
  padding:3px 9px; font-size:11.5px; font-weight:600; letter-spacing:.01em;
  background:var(--surface-3); color:var(--ink-2);
}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.crit{background:var(--crit-soft); color:var(--crit)}
.pill.primary{background:var(--primary-soft); color:var(--primary)}
.pill.accent{background:var(--accent-soft); color:var(--accent)}

label.field{display:grid; gap:4px; font-size:12.5px; font-weight:600; color:var(--ink-2)}
label.field > input, label.field > select, label.field > textarea{
  font-weight:400; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line-2); border-radius:var(--r-sm); padding:8px 10px; width:100%;
}
label.field > input:focus-visible, label.field > select:focus-visible, label.field > textarea:focus-visible,
button:focus-visible, .opt:focus-within{outline:2px solid var(--primary); outline-offset:1px}
textarea{resize:vertical; min-height:70px}

table{border-collapse:collapse; width:100%; font-size:13.5px}
th{text-align:left; font-weight:600; color:var(--ink-3); font-size:11px; letter-spacing:.07em; text-transform:uppercase; padding:8px 10px; border-bottom:1px solid var(--line)}
td{padding:9px 10px; border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* ---------- patient cards ---------- */
.bed-grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:14px; display:grid; gap:9px; text-align:left;
  border-left:4px solid var(--line-2); width:100%;
}
.pcard:hover{border-color:var(--line-2); transform:translateY(-1px)}
.pcard.due{border-left-color:var(--accent)}
.pcard.ok{border-left-color:var(--ok)}
.pcard.empty-bed{border-left-color:var(--line); background:var(--surface-2); box-shadow:none}
.pcard-top{display:flex; align-items:center; gap:8px}
.bed{font-family:var(--mono); font-weight:600; font-size:12px; color:var(--primary); background:var(--primary-soft); padding:2px 7px; border-radius:6px}
.pname{font-family:var(--display); font-weight:700; font-size:18px; letter-spacing:.02em}
.mini-scores{display:flex; gap:6px; flex-wrap:wrap}
.mini{background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:4px 7px; font-size:11px; line-height:1.25}
.mini b{display:block; font-family:var(--mono); font-size:13.5px; color:var(--ink)}

/* ---------- KPI ---------- */
.kpis{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
.kpi{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 12px}
.kpi .k-label{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.kpi .k-val{font-family:var(--mono); font-size:24px; font-weight:600; line-height:1.15; margin-top:3px}
.kpi .k-val small{font-size:12px; color:var(--ink-3); font-weight:500}
.delta{font-family:var(--mono); font-size:12px; font-weight:600}
.delta.up{color:var(--ok)} .delta.down{color:var(--crit)} .delta.flat{color:var(--ink-3)}

/* ---------- scale form ---------- */
.acc{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden}
.acc + .acc{margin-top:10px}
.acc-head{
  width:100%; display:flex; align-items:center; gap:10px; padding:13px 14px;
  background:var(--surface); border:0; text-align:left;
}
.acc-head:hover{background:var(--surface-2)}
.acc-title{font-family:var(--display); font-weight:600; font-size:15.5px}
.acc-sub{font-size:11.5px; color:var(--ink-3); display:block; font-family:var(--body); font-weight:400}
.acc-body{padding:0 14px 14px; border-top:1px solid var(--line)}
.chev{transition:transform .18s ease; color:var(--ink-3); flex:none}
.acc[open] .chev, .acc.open .chev{transform:rotate(90deg)}

.item{padding:13px 0; border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item-q{font-weight:600; font-size:14px; margin-bottom:8px; display:flex; gap:8px}
.item-q .n{color:var(--primary); font-family:var(--mono); font-size:13px; flex:none}
.opts{display:grid; gap:5px}
.opt{
  display:flex; gap:9px; align-items:flex-start; padding:7px 9px; border-radius:var(--r-sm);
  border:1px solid var(--line); background:var(--surface-2); font-size:13px; cursor:pointer;
}
.opt:hover{border-color:var(--line-2)}
.opt input{margin:2px 0 0; accent-color:var(--primary); flex:none}
.opt .sc{font-family:var(--mono); font-weight:600; color:var(--ink-3); flex:none; min-width:26px}
.opt.sel{background:var(--primary-soft); border-color:var(--primary)}
.opt.sel .sc{color:var(--primary)}
.opts.inline{display:flex; flex-wrap:wrap; gap:6px}
.opts.inline .opt{flex:1 1 auto; justify-content:center; min-width:52px; text-align:center}

.scale-total{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:12px; padding:11px 13px; border-radius:var(--r-sm);
  background:var(--surface-3); border:1px solid var(--line);
}
.scale-total .tv{font-family:var(--mono); font-size:22px; font-weight:600}

.alert{border-radius:var(--r-sm); padding:10px 12px; font-size:13px; display:flex; gap:9px; align-items:flex-start}
.alert.warn{background:var(--warn-soft); color:var(--warn)}
.alert.crit{background:var(--crit-soft); color:var(--crit)}
.alert.info{background:var(--primary-soft); color:var(--primary)}
.alert b{font-weight:600}

.chart-wrap{padding:6px 2px 0}
svg.chart{width:100%; height:auto; display:block; overflow:visible}

.copybox{width:100%; min-height:130px; font-family:var(--mono); font-size:11.5px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r-sm); padding:10px; color:var(--ink)}

.demo-banner{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  background:var(--accent-soft); color:var(--accent); border-radius:var(--r-sm);
  padding:10px 13px; font-size:13px; font-weight:500;
}
.footnote{font-size:11.5px; color:var(--ink-3); line-height:1.5}
.ref-list{display:grid; gap:7px; font-size:13px; padding-left:18px; margin:0}
.ref-list li{color:var(--ink-2)}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-3)}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
@media print{.topbar,.nav,.no-print{display:none!important} body{background:#fff}}
</style>

const $ = (s, r) => (r || document).querySelector(s);
const el = (t, p) => Object.assign(document.createElement(t), p || {});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hoy = () => new Date().toISOString().slice(0, 10);
function fFecha(iso){
  if(!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${d}-${m}-${y}`;
}
function diasEntre(a, b){
  if(!a || !b) return null;
  return Math.round((new Date(b + "T00:00") - new Date(a + "T00:00")) / 86400000);
}
function num(v){ const n = parseFloat(v); return Number.isFinite(n) ? n : null; }

/* --- confirmación táctil y bloqueo de pantalla (se usan en todo el archivo) --- */
function vibrar(patron){
  try{ if(navigator.vibrate) navigator.vibrate(patron || 12); }catch(e){}
}
let bloqueoPantalla = null;
async function pedirBloqueoPantalla(){
  try{
    if("wakeLock" in navigator && !bloqueoPantalla)
      bloqueoPantalla = await navigator.wakeLock.request("screen");
  }catch(e){}
}
function soltarBloqueoPantalla(){
  try{ if(bloqueoPantalla){ bloqueoPantalla.release(); bloqueoPantalla = null; } }catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && typeof Chrono !== "undefined" && Chrono.corriendo)
    pedirBloqueoPantalla();
});

const VITALES = [
  {id:"pas",  label:"PAS",  unidad:"mmHg", contextual:true},
  {id:"pad",  label:"PAD",  unidad:"mmHg", contextual:true},
  {id:"fc",   label:"FC",   unidad:"lpm",  crit:(v)=> v<50 || v>120, warn:(v)=> (v>=50&&v<60)||(v>100&&v<=120)},
  {id:"spo2", label:"SpO₂", unidad:"%",    crit:(v)=> v<90,          warn:(v)=> v>=90&&v<93},
  {id:"fr",   label:"FR",   unidad:"rpm",  crit:(v)=> v<10 || v>30,  warn:(v)=> v>24&&v<=30}
];

/* Estado de un signo vital. Para PAS y PAD el límite depende del paciente
   (tipo de ACV y terapia de reperfusión), según el protocolo del servicio. */
function estadoVital(id, val, cr){
  if(val === null || val === undefined) return "";
  if(id === "pas"){
    if(val < 90) return "crit";                 /* hipotensión: criterio general */
    if(!cr) return "";
    if(val >= cr.pas) return "crit";
    if(val >= cr.pas - 15) return "warn";
    return "";
  }
  if(id === "pad"){
    if(!cr) return "";
    if(val >= cr.pad) return "crit";
    if(val >= cr.pad - 10) return "warn";
    return "";
  }
  const def = VITALES.find(d => d.id === id);
  if(!def || !def.crit) return "";
  if(def.crit(val)) return "crit";
  if(def.warn && def.warn(val)) return "warn";
  return "";
}

function evaluarVitales(v, p){
  const alertas = [];
  if(!v) return alertas;
  const cr = p ? criteriosMovilizacion(p) : null;
  VITALES.forEach(def => {
    const val = num(v[def.id]);
    if(val === null) return;
    const est = estadoVital(def.id, val, cr);
    if(!est) return;
    let txt;
    if(def.id === "pas" && val < 90)
      txt = `PAS ${val} mmHg — hipotensión: riesgo de intolerancia ortostática al sedestar o bipedestar`;
    else if(def.contextual && cr && est === "crit")
      txt = `${def.label} ${val} mmHg — supera el límite de ${def.id === "pas" ? cr.pas : cr.pad} mmHg que el protocolo fija para ${cr.etiqueta}`;
    else if(def.contextual && cr)
      txt = `${def.label} ${val} mmHg — cerca del límite de ${def.id === "pas" ? cr.pas : cr.pad} mmHg: controlar durante la sesión`;
    else if(est === "crit")
      txt = `${def.label} ${val} ${def.unidad} fuera del rango seguro para movilización`;
    else
      txt = `${def.label} ${val} ${def.unidad} en rango límite: monitorizar durante la sesión`;
    alertas.push({tono:est, txt});
  });
  return alertas;
}

const TIPOS_ACV = ["Isquémico","Hemorrágico intracerebral","Hemorragia subaracnoidea","Isquémico con transformación hemorrágica","Trombosis venosa cerebral","Por precisar"];
const SUBTIPOS = ["TACI (total anterior)","PACI (parcial anterior)","LACI (lacunar)","POCI (circulación posterior)","No aplica / por precisar"];
</script>

<script>
"use strict";

/* ============================================================
   ESTADO Y PERSISTENCIA (solo en este dispositivo)
   ============================================================ */
let state = { version:1, patients:[], demo:false };
let ui = { view:"pacientes", pid:null, draft:null, chartScale:"pass" };

function guardar(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("No se pudo guardar localmente", e); }
}
function cargar(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const p = JSON.parse(raw); if(p && Array.isArray(p.patients)){ state = p; return true; } }
  }catch(e){ console.warn("No se pudo leer el almacenamiento local", e); }
  return false;
}

/* ============================================================
   CÁLCULO E INTERPRETACIÓN
   ============================================================ */
function totalEscala(key, reg){
  if(!reg || reg.noEval) return null;
  const S = SCALES[key];
  /* puntaje ingresado directamente desde la calculadora rápida */
  if(reg.totalDirecto !== undefined && reg.totalDirecto !== null && reg.totalDirecto !== ""){
    const v = num(reg.totalDirecto);
    return v === null ? null : +v.toFixed(S.decimales || (S.tipo === "tiempo" ? 1 : 0));
  }
  if(S.tipo === "tiempo"){ return num(reg.tiempo); }
  const items = reg.items || {};
  let suma = 0, contados = 0;
  S.items.forEach(it => {
    const v = items[it.id];
    if(v !== undefined && v !== null && v !== ""){ suma += parseFloat(v); contados++; }
  });
  if(contados === 0) return null;
  if(contados < S.items.length) return null;          // incompleta
  return +( (S.base || 0) + suma ).toFixed(S.decimales || 0);
}
function completitud(key, reg){
  const S = SCALES[key];
  if(reg && reg.totalDirecto !== undefined && reg.totalDirecto !== null && reg.totalDirecto !== "")
    return { hechos:1, total:1 };
  if(S.tipo === "tiempo") return { hechos: num(reg && reg.tiempo)!==null ? 1:0, total:1 };
  const items = (reg && reg.items) || {};
  let n = 0;
  S.items.forEach(it => { if(items[it.id] !== undefined && items[it.id] !== null && items[it.id] !== "") n++; });
  return { hechos:n, total:S.items.length };
}
function interpretar(key, total){
  if(total === null || total === undefined) return null;
  const S = SCALES[key];
  for(const b of S.bandas){ if(total <= b.max) return b; }
  return S.bandas[S.bandas.length-1];
}
function fmtTotal(key, total){
  if(total === null || total === undefined) return "—";
  const S = SCALES[key];
  if(S.tipo === "tiempo") return total.toFixed(1).replace(".", ",") + " s";
  if(S.decimales) return total.toFixed(S.decimales).replace(".", ",");
  return String(total);
}
function subtotalPASS(reg, rango){
  const items = (reg && reg.items) || {};
  let s = 0, n = 0;
  SCALES.pass.items.slice(rango.desde, rango.hasta+1).forEach(it => {
    const v = items[it.id];
    if(v !== undefined && v !== null && v !== ""){ s += parseFloat(v); n++; }
  });
  return n ? s : null;
}
function interpretarNIHSS(v){
  const n = num(v);
  if(n === null) return null;
  if(n === 0)  return {txt:"Sin déficit neurológico", tono:"ok"};
  if(n <= 4)   return {txt:"ACV leve", tono:"ok"};
  if(n <= 15)  return {txt:"ACV moderado", tono:"warn"};
  if(n <= 20)  return {txt:"ACV moderado a severo", tono:"warn"};
  return {txt:"ACV severo", tono:"crit"};
}

/* ---------- pacientes ---------- */
function getPaciente(id){ return state.patients.find(p => p.id === id) || null; }
function evalsOrdenadas(p){ return (p.evals || []).slice().sort((a,b) => a.fecha.localeCompare(b.fecha)); }
function ultimaEval(p){ const e = evalsOrdenadas(p); return e.length ? e[e.length-1] : null; }
function serie(p, key){
  return evalsOrdenadas(p)
    .map(ev => ({ fecha:ev.fecha, tipo:ev.tipo, valor: totalEscala(key, (ev.scales||{})[key]) }))
    .filter(d => d.valor !== null);
}
function estadoControl(p){
  const u = ultimaEval(p);
  if(!u) return { tono:"", txt:"Sin evaluaciones", dias:null };
  const d = diasEntre(u.fecha, hoy());
  if(d === null) return { tono:"", txt:"—", dias:null };
  if(d >= 7) return { tono:"due", txt:`Control pendiente · ${d} días`, dias:d };
  return { tono:"ok", txt: d === 0 ? "Evaluado hoy" : `Hace ${d} ${d===1?"día":"días"}`, dias:d };
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
function irA(view, pid){
  ui.view = view;
  if(pid !== undefined) ui.pid = pid;
  document.querySelectorAll(".nav button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.view === view)));
  ["pacientes","paciente","evaluacion","calculadora","referencia","datos"].forEach(v =>
    $("#view-" + v).hidden = (v !== view));
  if(view === "pacientes")  renderCamas();
  if(view === "paciente")   renderFicha();
  if(view === "evaluacion") renderEvaluacion();
  if(view === "calculadora") renderCalculadora();
  if(view === "referencia") renderReferencia();
  if(view === "datos")      renderDatos();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ============================================================
   VISTA · CAMAS
   ============================================================ */
function renderCamas(){
  const cont = $("#bedGrid");
  cont.innerHTML = "";
  $("#demoBanner").hidden = !state.demo;
  const avisoResp = $("#avisoRespaldo");
  if(avisoResp) avisoResp.innerHTML = bannerRespaldo();

  const usadas = new Set();
  CAMAS.forEach(cama => {
    const p = state.patients.find(x => x.cama === cama);
    if(p){ usadas.add(p.id); cont.appendChild(tarjetaPaciente(p)); }
    else {
      const b = el("button", {className:"pcard empty-bed"});
      b.innerHTML = `<div class="pcard-top"><span class="bed">${esc(cama)}</span></div>
        <div class="muted small">Cama disponible — toca para ingresar un paciente</div>`;
      b.onclick = () => nuevoPaciente(cama);
      cont.appendChild(b);
    }
  });
  state.patients.filter(p => !usadas.has(p.id)).forEach(p => cont.appendChild(tarjetaPaciente(p)));

  /* resumen del servicio */
  const box = $("#resumenServicio");
  const n = state.patients.length;
  const pend = state.patients.filter(p => estadoControl(p).tono === "due").length;
  const conAlerta = state.patients.filter(p => {
    const u = ultimaEval(p);
    return u && evaluarVitales(u.vitals, p).some(a => a.tono === "crit");
  }).length;
  box.innerHTML = `
    <p class="eyebrow">Resumen del turno</p>
    <div class="kpis" style="margin-top:10px">
      <div class="kpi"><div class="k-label">Pacientes</div><div class="k-val">${n}<small> / ${CAMAS.length} camas</small></div></div>
      <div class="kpi"><div class="k-label">Controles pendientes</div><div class="k-val" style="color:${pend?'var(--accent)':'inherit'}">${pend}</div></div>
      <div class="kpi"><div class="k-label">Alerta de signos vitales</div><div class="k-val" style="color:${conAlerta?'var(--crit)':'inherit'}">${conAlerta}</div></div>
      <div class="kpi"><div class="k-label">Evaluaciones registradas</div><div class="k-val">${state.patients.reduce((a,p)=>a+(p.evals||[]).length,0)}</div></div>
    </div>
    <p class="footnote" style="margin:12px 0 0">Las escalas se aplican al ingreso y luego cada 7 días. La alerta de signos vitales usa criterios orientativos de seguridad para movilización precoz; la decisión clínica siempre es del equipo tratante.</p>`;
}

function tarjetaPaciente(p){
  const est = estadoControl(p);
  const u = ultimaEval(p);
  const b = el("button", {className:"pcard " + (est.tono || "")});
  const minis = ESCALAS_PRINCIPALES.map(k => {
    const t = u ? totalEscala(k, (u.scales||{})[k]) : null;
    return `<span class="mini">${SCALES[k].sigla}<b>${fmtTotal(k,t)}</b></span>`;
  }).join("");
  const alertas = u ? evaluarVitales(u.vitals, p) : [];
  const critica = alertas.some(a => a.tono === "crit");
  b.innerHTML = `
    <div class="pcard-top">
      <span class="bed">${esc(p.cama || "s/cama")}</span>
      <span class="pname">${esc(p.iniciales || "—")}</span>
      <span style="margin-left:auto; display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end">
        ${pillEspera(p)}
        ${pillReperfusion(p)}
        ${critica ? '<span class="pill crit">Signos vitales</span>' : ""}
      </span>
    </div>
    <div class="small muted">${esc(p.tipoACV || "Tipo de ACV por precisar")}${p.ladoAfectado ? " · hemiparesia " + esc(p.ladoAfectado.toLowerCase()) : ""}</div>
    <div class="mini-scores">${minis}</div>
    <div class="row" style="gap:6px">
      ${u ? (() => { const r = calcularCarga(u);
              return `<span class="pill ${r.cat.tono}" title="Carga de rehabilitación">${r.cat.corto} carga · ${r.total}</span>`; })() : ""}
      <span class="pill ${est.tono==='due'?'accent':(est.tono==='ok'?'ok':'')}">${esc(est.txt)}</span>
      <span class="small muted">${(p.evals||[]).length} eval.</span>
    </div>`;
  b.onclick = () => irA("paciente", p.id);
  return b;
}

/* ============================================================
   ALTA / EDICIÓN DE PACIENTE
   ============================================================ */
function nuevoPaciente(camaSugerida){
  const p = {
    id: uid(), iniciales:"", cama: camaSugerida || "", edad:"", sexo:"",
    fechaIngreso: hoy(), tipoACV:"", subtipo:"", ladoAfectado:"",
    nihss:"", nihssFecha:"", antecedentes:"", kine:"", evals:[]
  };
  state.patients.push(p); guardar();
  irA("paciente", p.id);
  setTimeout(() => { const i = $("#f-iniciales"); if(i) i.focus(); }, 60);
}

/* ============================================================
   VISTA · FICHA DEL PACIENTE
   ============================================================ */
function renderFicha(){
  const v = $("#view-paciente");
  const p = getPaciente(ui.pid) || state.patients[0];
  if(!p){
    v.innerHTML = `<div class="card card-pad"><h2>Sin pacientes</h2>
      <p class="muted small" style="margin:6px 0 12px">Ingresa un paciente desde la vista de camas para comenzar el seguimiento.</p>
      <button class="btn" onclick="nuevoPaciente()">+ Ingresar paciente</button></div>`;
    return;
  }
  ui.pid = p.id;
  const evs = evalsOrdenadas(p).slice().reverse();
  const u = evs[0] || null;
  const prev = evs[1] || null;
  const est = estadoControl(p);
  const nih = interpretarNIHSS(p.nihss);

  v.innerHTML = `
    <div class="row">
      <div>
        <p class="eyebrow">Ficha de seguimiento</p>
        <h1 style="font-size:26px">${esc(p.iniciales || "Paciente sin iniciales")} <span class="bed" style="font-size:13px; vertical-align:middle">${esc(p.cama || "s/cama")}</span></h1>
        <p class="small muted" style="margin:4px 0 6px">
          Ingreso ${fFecha(p.fechaIngreso)}${p.fechaIngreso ? ` · día ${diasEntre(p.fechaIngreso, hoy())} de hospitalización` : ""}
        </p>
        <span class="lado-badge ${p.ladoAfectado && p.ladoAfectado !== "Sin compromiso motor" ? "" : "neutro"}">
          ${p.ladoAfectado && p.ladoAfectado !== "Sin compromiso motor"
            ? (p.ladoAfectado === "Bilateral" ? "Compromiso bilateral" : "Hemicuerpo " + p.ladoAfectado.toLowerCase() + " afectado")
            : "Hemicuerpo afectado sin definir"}
        </span>
      </div>
      <span class="spacer"></span>
      <button class="btn no-print" id="btnNuevaEval">+ Nueva evaluación</button>
      <button class="btn ghost no-print" id="btnResumen">Resumen para ficha</button>
    </div>

    <div class="card">
      <div class="card-head"><h2>Datos del paciente</h2><span class="spacer"></span><span class="pill ${est.tono==='due'?'accent':(est.tono==='ok'?'ok':'')}">${esc(est.txt)}</span></div>
      <div class="card-pad grid-2" id="fichaDatos">
        <label class="field">Iniciales<input id="f-iniciales" maxlength="6" placeholder="J.P.M." value="${esc(p.iniciales)}"></label>
        <label class="field">Cama
          <select id="f-cama">
            <option value="">— sin asignar —</option>
            ${CAMAS.map(c => `<option${c===p.cama?" selected":""}>${c}</option>`).join("")}
            ${p.cama && !CAMAS.includes(p.cama) ? `<option selected>${esc(p.cama)}</option>` : ""}
          </select></label>
        <label class="field">Edad<input id="f-edad" type="number" min="0" max="120" inputmode="numeric" value="${esc(p.edad)}"></label>
        <label class="field">Sexo
          <select id="f-sexo">${["","Femenino","Masculino","Otro"].map(s=>`<option${s===p.sexo?" selected":""}>${s}</option>`).join("")}</select></label>
        <label class="field">Fecha de ingreso<input id="f-fechaIngreso" type="date" value="${esc(p.fechaIngreso)}"></label>
        <label class="field">Tipo de ACV
          <select id="f-tipoACV"><option value=""></option>${TIPOS_ACV.map(t=>`<option${t===p.tipoACV?" selected":""}>${t}</option>`).join("")}</select></label>
        <label class="field">Clasificación (Bamford)
          <select id="f-subtipo"><option value=""></option>${SUBTIPOS.map(t=>`<option${t===p.subtipo?" selected":""}>${t}</option>`).join("")}</select></label>
        <label class="field">Hemicuerpo afectado
          <select id="f-ladoAfectado">${["","Derecho","Izquierdo","Bilateral","Sin compromiso motor"].map(s=>`<option${s===p.ladoAfectado?" selected":""}>${s}</option>`).join("")}</select></label>
        <label class="field">NIHSS al ingreso <span class="muted" style="font-weight:400">(desde la ficha clínica)</span>
          <input id="f-nihss" type="number" min="0" max="42" inputmode="numeric" value="${esc(p.nihss)}"></label>
        <label class="field">Fecha del NIHSS<input id="f-nihssFecha" type="date" value="${esc(p.nihssFecha)}"></label>
        <label class="field" style="grid-column:1/-1">Antecedentes y observaciones<textarea id="f-antecedentes" placeholder="Comorbilidades, precauciones, oxigenoterapia, dispositivos...">${esc(p.antecedentes)}</textarea></label>
        <label class="field">Kinesiólogo/a a cargo<input id="f-kine" value="${esc(p.kine)}"></label>
      </div>
      ${nih ? `<div class="card-pad" style="padding-top:0"><span class="pill ${nih.tono}">NIHSS ${esc(p.nihss)} · ${esc(nih.txt)}</span></div>` : ""}
    </div>

    <div class="card">
      <div class="card-head"><h2>Terapia de reperfusión</h2><span class="spacer"></span>
        <span class="small muted">trombólisis · trombectomía</span></div>
      <div class="card-pad">
        <div class="grid-2" style="margin-bottom:${p.reperfusion ? "16px" : "0"}">
          <label class="field">¿Recibió terapia de reperfusión?
            <select id="f-reperfusion">
              ${REPERFUSION.map(t => `<option value="${esc(t)}"${t === (p.reperfusion||"") ? " selected" : ""}>${t || "— por definir —"}</option>`).join("")}
            </select></label>
          <label class="field">Inicio de síntomas <span class="muted" style="font-weight:400">o última vez visto sano</span>
            <input id="f-inicioFecha" type="date" value="${esc(p.inicioFecha||"")}"></label>
          <label class="field">Hora de inicio<input id="f-inicioHora" type="time" value="${esc(p.inicioHora||"")}"></label>
          ${conTrombolisis(p.reperfusion) ? `
            <label class="field">Fecha de la trombólisis<input id="f-tlFecha" type="date" value="${esc(p.tlFecha||"")}"></label>
            <label class="field">Hora de la trombólisis<input id="f-tlHora" type="time" value="${esc(p.tlHora||"")}"></label>` : ""}
          ${conTrombectomia(p.reperfusion) ? `
            <label class="field">Fecha de la trombectomía<input id="f-tmFecha" type="date" value="${esc(p.tmFecha||"")}"></label>
            <label class="field">Hora de la trombectomía<input id="f-tmHora" type="time" value="${esc(p.tmHora||"")}"></label>` : ""}
        </div>
        ${tarjetaReperfusion(p)}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Criterios de movilización</h2><span class="spacer"></span>
        <span class="small muted">protocolo UTAC · según este paciente</span></div>
      <div class="card-pad">${tarjetaCriterios(p, false)}</div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Última evaluación</h2>
        <span class="spacer"></span>
        <span class="small muted">${u ? fFecha(u.fecha) + " · " + esc(u.tipo) : "sin registros"}</span></div>
      <div class="card-pad" id="kpiWrap"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Carga de rehabilitación</h2><span class="spacer"></span>
        <span class="small muted">protocolo UTAC · ${u ? fFecha(u.fecha) : "sin registro"}</span></div>
      <div class="card-pad">
        ${u ? cargaHTML(calcularCarga(u), false) + historialCarga(p)
            : '<p class="muted small">Se calcula automáticamente al registrar la primera evaluación.</p>'}
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Esquema corporal</h2><span class="spacer"></span>
        <span class="small muted">fuerza MRC por segmento · ${u ? fFecha(u.fecha) : "sin registro"}</span></div>
      <div class="card-pad">${mapaCorporal(p, u)}</div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Evolución</h2><span class="spacer"></span>
        <select id="selChart" style="border:1px solid var(--line-2); background:var(--surface-2); border-radius:8px; padding:6px 9px; font-size:13px">
          ${ESCALAS_ORDEN.map(k => `<option value="${k}"${k===ui.chartScale?" selected":""}>${SCALES[k].sigla} — ${SCALES[k].nombre}</option>`).join("")}
        </select></div>
      <div class="card-pad chart-wrap" id="chartWrap"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Historial de evaluaciones</h2></div>
      <div class="scroll-x" id="histWrap"></div>
    </div>

    <div class="card card-pad no-print">
      <div class="row">
        <span class="small muted">Este paciente se guarda solo en este dispositivo.</span>
        <span class="spacer"></span>
        <button class="btn danger sm" id="btnEliminarPaciente">Eliminar paciente</button>
      </div>
    </div>`;

  /* enlaces de datos */
  ["iniciales","cama","edad","sexo","fechaIngreso","tipoACV","subtipo","ladoAfectado","nihss","nihssFecha","antecedentes","kine",
   "reperfusion","inicioFecha","inicioHora","tlFecha","tlHora","tmFecha","tmHora"]
    .forEach(campo => {
      const node = $("#f-" + campo);
      if(!node) return;
      node.addEventListener("change", () => {
        p[campo] = node.value;
        guardar();
        if(["iniciales","cama","nihss","ladoAfectado","reperfusion",
            "inicioFecha","inicioHora","tlFecha","tlHora","tmFecha","tmHora"].includes(campo)) renderFicha();
      });
    });

  $("#btnNuevaEval").onclick = () => { ui.draft = null; irA("evaluacion", p.id); };
  $("#btnResumen").onclick   = () => mostrarResumen(p);
  $("#btnEliminarPaciente").onclick = () => {
    if(confirm(`¿Eliminar a ${p.iniciales || "este paciente"} y sus ${(p.evals||[]).length} evaluaciones? Esta acción no se puede deshacer.`)){
      state.patients = state.patients.filter(x => x.id !== p.id);
      guardar(); irA("pacientes");
    }
  };
  $("#selChart").onchange = (e) => { ui.chartScale = e.target.value; pintarGrafico(p); };

  pintarKPIs(p, u, prev);
  pintarGrafico(p);
  pintarHistorial(p);
}

function pintarKPIs(p, u, prev){
  const w = $("#kpiWrap");
  if(!u){
    w.innerHTML = `<p class="muted small">Aún no hay evaluaciones. Registra la <b>evaluación de ingreso</b> para iniciar el seguimiento.</p>`;
    return;
  }
  const alertas = evaluarVitales(u.vitals, p);
  const cards = ESCALAS_ORDEN.map(k => {
    const reg = (u.scales||{})[k];
    const t = totalEscala(k, reg);
    const tp = prev ? totalEscala(k, (prev.scales||{})[k]) : null;
    if(t === null && !reg) return "";
    let delta = "";
    if(t !== null && tp !== null){
      const d = +(t - tp).toFixed(SCALES[k].decimales || 1);
      const mejor = SCALES[k].mejor === "alto" ? d > 0 : d < 0;
      const cls = d === 0 ? "flat" : (mejor ? "up" : "down");
      delta = `<span class="delta ${cls}">${d > 0 ? "+" : ""}${String(d).replace(".",",")}</span>`;
    }
    const band = interpretar(k, t);
    const S = SCALES[k];
    const maxTxt = S.tipo === "tiempo" ? "" : ` <small>/ ${S.max}</small>`;
    return `<div class="kpi">
      <div class="k-label">${S.sigla}</div>
      <div class="k-val"${band?` style="color:var(--${band.tono})"`:""}>${t===null ? "—" : fmtTotal(k,t).replace(" s","")}${t!==null?maxTxt:""} ${delta}</div>
      ${band ? `<div class="small" style="color:var(--${band.tono}); font-weight:500; margin-top:3px; line-height:1.3">${esc(band.txt)}</div>` : `<div class="small muted" style="margin-top:3px">${reg && reg.noEval ? "No evaluada" : "Incompleta"}</div>`}
    </div>`;
  }).join("");

  const crMov = criteriosMovilizacion(p);
  const vit = VITALES.map(d => {
    const val = num((u.vitals||{})[d.id]);
    const est = estadoVital(d.id, val, crMov);
    const tono = val===null ? "" : (est || "ok");
    return `<div class="kpi" style="${tono?`border-color:var(--${tono})`:""}">
      <div class="k-label">${d.label}</div>
      <div class="k-val" style="font-size:20px; ${tono?`color:var(--${tono})`:""}">${val===null?"—":val}<small> ${d.unidad}</small></div>
    </div>`;
  }).join("");

  w.innerHTML = `
    <div class="kpis">${cards}</div>
    <p class="eyebrow" style="margin:18px 0 8px">Signos vitales del control</p>
    <div class="kpis">${vit}</div>
    ${alertas.length ? alertas.map(a => `<div class="alert ${a.tono}" style="margin-top:10px"><b>${a.tono==="crit"?"Alerta":"Precaución"}:</b> ${esc(a.txt)}</div>`).join("") : ""}
    ${u.notas ? `<p class="eyebrow" style="margin:18px 0 6px">Observaciones</p><p class="timeline-note">${esc(u.notas)}</p>` : ""}`;
}
</script>

<style>
.modal-bg{position:fixed; inset:0; background:rgba(8,22,20,.55); display:grid; place-items:center; padding:16px; z-index:90}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 20px 50px rgba(0,0,0,.28); max-width:640px; width:100%; max-height:86vh; overflow:auto}
.modal .card-head{position:sticky; top:0; background:var(--surface); z-index:2}
</style>

<script>
"use strict";

/* ============================================================
   GRÁFICO DE EVOLUCIÓN
   ============================================================ */
function pintarGrafico(p){
  const w = $("#chartWrap");
  const key = ui.chartScale;
  const S = SCALES[key];
  const datos = serie(p, key);

  if(datos.length === 0){
    w.innerHTML = `<p class="muted small">Sin mediciones de ${S.sigla} registradas todavía.</p>`;
    return;
  }

  const W = 720, H = 250, L = 46, R = 16, T = 18, B = 42;
  const innerW = W - L - R, innerH = H - T - B;

  let yMin, yMax;
  if(S.tipo === "tiempo"){
    const vals = datos.map(d => d.valor);
    yMax = Math.max(30, Math.ceil(Math.max.apply(null, vals) / 10) * 10);
    yMin = 0;
  } else { yMin = S.min || 0; yMax = S.max; }

  const n = datos.length;
  const x = (i) => L + (n === 1 ? innerW / 2 : (innerW * i) / (n - 1));
  const y = (v) => T + innerH - ((v - yMin) / (yMax - yMin)) * innerH;

  const ticks = 4;
  let grid = "", ejes = "";
  for(let i = 0; i <= ticks; i++){
    const v = yMin + ((yMax - yMin) * i) / ticks;
    const yy = y(v);
    grid += `<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    ejes += `<text x="${L-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" fill="var(--ink-3)" font-size="11" font-family="IBM Plex Mono, monospace">${S.decimales ? v.toFixed(1).replace(".",",") : Math.round(v)}</text>`;
  }

  const linea = datos.map((d,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(d.valor).toFixed(1)}`).join(" ");
  const area = `M${x(0).toFixed(1)},${(T+innerH).toFixed(1)} ` +
    datos.map((d,i) => `L${x(i).toFixed(1)},${y(d.valor).toFixed(1)}`).join(" ") +
    ` L${x(n-1).toFixed(1)},${(T+innerH).toFixed(1)} Z`;

  const puntos = datos.map((d,i) => {
    const ultimo = i === n - 1;
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(d.valor).toFixed(1)}" r="${ultimo?5.5:4}"
      fill="${ultimo?"var(--primary)":"var(--surface)"}" stroke="var(--primary)" stroke-width="2"/>
      <text x="${x(i).toFixed(1)}" y="${(y(d.valor)-12).toFixed(1)}" text-anchor="middle" fill="var(--ink)" font-size="11.5" font-weight="600" font-family="IBM Plex Mono, monospace">${fmtTotal(key,d.valor).replace(" s","")}</text>`;
  }).join("");

  const fechas = datos.map((d,i) =>
    `<text x="${x(i).toFixed(1)}" y="${(T+innerH+18).toFixed(1)}" text-anchor="middle" fill="var(--ink-3)" font-size="10.5" font-family="IBM Plex Sans, sans-serif">${fFecha(d.fecha).slice(0,5)}</text>
     <text x="${x(i).toFixed(1)}" y="${(T+innerH+31).toFixed(1)}" text-anchor="middle" fill="var(--ink-3)" font-size="9.5" font-family="IBM Plex Sans, sans-serif">${d.tipo === "Ingreso" ? "ingreso" : "control"}</text>`).join("");

  const primero = datos[0].valor, ultimo = datos[n-1].valor;
  const cambio = +(ultimo - primero).toFixed(S.decimales || 1);
  const mejora = S.mejor === "alto" ? cambio > 0 : cambio < 0;
  const relevante = key === "tug" ? Math.abs(cambio) >= 2.9 : true;

  w.innerHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de ${S.sigla}">
      ${grid}${ejes}
      <path d="${area}" fill="var(--primary)" opacity="0.08"/>
      <path d="${linea}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${puntos}${fechas}
    </svg>
    <div class="row" style="margin-top:6px">
      <span class="pill ${n>1 ? (cambio===0 ? "" : (mejora?"ok":"crit")) : ""}">
        ${n>1 ? `${cambio>0?"+":""}${String(cambio).replace(".",",")} desde el ingreso` : "Primera medición"}
      </span>
      <span class="small muted">${esc(S.nombre)}${S.tipo!=="tiempo" ? ` · escala 0–${S.max}` : " · segundos"}</span>
      ${key==="tug" && n>1 && !relevante ? `<span class="pill warn">Cambio menor al MDC (2,9 s)</span>` : ""}
    </div>
    <p class="footnote" style="margin:10px 0 0">${esc(S.nota)}</p>`;
}

/* ============================================================
   HISTORIAL
   ============================================================ */
function pintarHistorial(p){
  const w = $("#histWrap");
  const evs = evalsOrdenadas(p).slice().reverse();
  if(!evs.length){ w.innerHTML = `<p class="muted small" style="padding:16px">Sin evaluaciones registradas.</p>`; return; }
  const filas = evs.map(ev => {
    const v = ev.vitals || {};
    const cols = ESCALAS_ORDEN.map(k => {
      const reg = (ev.scales||{})[k];
      const t = totalEscala(k, reg);
      return `<td class="num">${t===null ? `<span class="muted">${reg&&reg.noEval?"n/e":"—"}</span>` : fmtTotal(k,t).replace(" s","")}</td>`;
    }).join("");
    return `<tr>
      <td><b>${fFecha(ev.fecha)}</b><br><span class="small muted">${esc(ev.tipo)}</span>
        ${ev.modo === "rapido" ? '<br><span class="pill" style="margin-top:3px">puntajes directos</span>' : ""}</td>
      ${cols}
      <td class="num small">${v.pas||"—"}/${v.pad||"—"}</td>
      <td class="num small">${v.fc||"—"}</td>
      <td class="num small">${v.spo2||"—"}</td>
      <td class="num small">${v.fr||"—"}</td>
      <td>${(() => { const r = calcularCarga(ev);
            return `<span class="pill ${r.cat.tono}">${r.cat.corto} · ${r.total}</span>`; })()}</td>
      <td class="no-print"><button class="btn ghost sm" data-edit="${ev.id}">Abrir</button></td>
    </tr>`;
  }).join("");
  w.innerHTML = `<table>
    <thead><tr><th>Fecha</th>${ESCALAS_ORDEN.map(k=>`<th>${SCALES[k].sigla}</th>`).join("")}
    <th>PA</th><th>FC</th><th>SpO₂</th><th>FR</th><th>Carga</th><th class="no-print"></th></tr></thead>
    <tbody>${filas}</tbody></table>`;
  w.querySelectorAll("[data-edit]").forEach(b => {
    b.onclick = () => {
      const ev = (p.evals||[]).find(e => e.id === b.dataset.edit);
      ui.draft = JSON.parse(JSON.stringify(ev));
      irA("evaluacion", p.id);
    };
  });
}

/* ============================================================
   VISTA · EVALUACIÓN
   ============================================================ */
function nuevoDraft(p){
  const u = ultimaEval(p);
  return {
    id: uid(),
    fecha: hoy(),
    tipo: (p.evals||[]).length === 0 ? "Ingreso" : "Control 7 días",
    vitals:{pas:"",pad:"",fc:"",spo2:"",fr:""},
    scales:{},
    notas:"",
    evaluador: p.kine || "",
    _nuevo: true,
    _sugerida: u ? diasEntre(u.fecha, hoy()) : null
  };
}

function renderEvaluacion(){
  const v = $("#view-evaluacion");
  const p = getPaciente(ui.pid);
  if(!p){
    v.innerHTML = `<div class="card card-pad"><h2>Selecciona un paciente</h2>
      <p class="muted small" style="margin-top:6px">Abre una cama para registrar su evaluación.</p></div>`;
    return;
  }
  if(!ui.draft) ui.draft = nuevoDraft(p);
  const d = ui.draft;

  v.innerHTML = `
    <div class="row">
      <div>
        <p class="eyebrow">${d._nuevo ? "Nueva evaluación" : "Editando evaluación"}</p>
        <h1 style="font-size:24px">${esc(p.iniciales || "Paciente")} · ${esc(p.cama || "s/cama")}</h1>
      </div>
      <span class="spacer"></span>
      <button class="btn ghost no-print" id="btnCancelarEval">Cancelar</button>
      <button class="btn no-print" id="btnGuardarEval">Guardar evaluación</button>
    </div>

    <div class="card card-pad">
      <div class="grid-2">
        <label class="field">Fecha de la evaluación<input id="e-fecha" type="date" value="${esc(d.fecha)}"></label>
        <label class="field">Momento
          <select id="e-tipo">${["Ingreso","Control 7 días","Control extraordinario","Egreso / traslado"].map(t=>`<option${t===d.tipo?" selected":""}>${t}</option>`).join("")}</select></label>
        <label class="field">Evaluador/a<input id="e-evaluador" value="${esc(d.evaluador||"")}"></label>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Signos vitales</h2><span class="spacer"></span><span class="small muted">previo a la movilización</span></div>
      <div class="card-pad">
        <div style="margin-bottom:14px">${tarjetaCriterios(p, true)}</div>
        <div class="vit-grid">
          <label class="field">PAS <span class="muted" style="font-weight:400">mmHg</span><input id="v-pas" type="number" inputmode="numeric" value="${esc(d.vitals.pas)}"></label>
          <label class="field">PAD <span class="muted" style="font-weight:400">mmHg</span><input id="v-pad" type="number" inputmode="numeric" value="${esc(d.vitals.pad)}"></label>
          <label class="field">FC <span class="muted" style="font-weight:400">lpm</span><input id="v-fc" type="number" inputmode="numeric" value="${esc(d.vitals.fc)}"></label>
          <label class="field">SpO₂ <span class="muted" style="font-weight:400">%</span><input id="v-spo2" type="number" inputmode="numeric" value="${esc(d.vitals.spo2)}"></label>
          <label class="field">FR <span class="muted" style="font-weight:400">rpm</span><input id="v-fr" type="number" inputmode="numeric" value="${esc(d.vitals.fr)}"></label>
        </div>
        <div id="vitAlertas" style="display:grid; gap:8px; margin-top:12px"></div>
      </div>
    </div>

    <div>
      <p class="eyebrow" style="margin-bottom:8px">Escalas principales · se aplican en cada control</p>
      <div id="escalasPrincipales"></div>
    </div>

    <div>
      <p class="eyebrow" style="margin-bottom:8px">Escalas complementarias · opcionales</p>
      <div id="escalasExtra"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Carga de rehabilitación</h2><span class="spacer"></span>
        <span class="small muted">se calcula sola con las 4 escalas principales</span></div>
      <div class="card-pad" id="cargaLive"></div>
    </div>

    <div class="card card-pad">
      <label class="field">Observaciones de la sesión
        <textarea id="e-notas" placeholder="Tolerancia, ayuda técnica, incidentes, objetivos para la semana...">${esc(d.notas||"")}</textarea></label>
    </div>

    <div class="row no-print">
      <button class="btn" id="btnGuardarEval2">Guardar evaluación</button>
      ${!d._nuevo ? `<button class="btn danger" id="btnBorrarEval">Eliminar esta evaluación</button>` : ""}
      <span class="spacer"></span>
      <span class="small muted">Se guarda en este dispositivo.</span>
    </div>`;

  /* cabecera */
  $("#e-fecha").onchange = e => { d.fecha = e.target.value; };
  $("#e-tipo").onchange  = e => { d.tipo = e.target.value; };
  $("#e-evaluador").onchange = e => { d.evaluador = e.target.value; };
  $("#e-notas").onchange = e => { d.notas = e.target.value; };

  VITALES.forEach(def => {
    const node = $("#v-" + def.id);
    node.addEventListener("input", () => { d.vitals[def.id] = node.value; pintarAlertasVitales(); });
  });
  pintarAlertasVitales();

  $("#escalasPrincipales").innerHTML = ESCALAS_PRINCIPALES.map(k => bloqueEscala(k, d)).join("");
  $("#escalasExtra").innerHTML       = ESCALAS_EXTRA.map(k => bloqueEscala(k, d)).join("");
  conectarEscalas(d);
  pintarCargaLive(d);

  const guardarEval = () => {
    if(!d.fecha){ alert("Indica la fecha de la evaluación."); return; }
    const copia = JSON.parse(JSON.stringify(d));
    delete copia._nuevo; delete copia._sugerida;
    p.evals = (p.evals || []).filter(e => e.id !== copia.id);
    p.evals.push(copia);
    if(!p.kine && copia.evaluador) p.kine = copia.evaluador;
    guardar(); ui.draft = null; irA("paciente", p.id);
  };
  $("#btnGuardarEval").onclick = guardarEval;
  $("#btnGuardarEval2").onclick = guardarEval;
  $("#btnCancelarEval").onclick = () => { ui.draft = null; irA("paciente", p.id); };
  const del = $("#btnBorrarEval");
  if(del) del.onclick = () => {
    if(confirm("¿Eliminar esta evaluación?")){
      p.evals = (p.evals||[]).filter(e => e.id !== d.id);
      guardar(); ui.draft = null; irA("paciente", p.id);
    }
  };
}

function pintarAlertasVitales(){
  const cont = $("#vitAlertas");
  if(!cont) return;
  const alertas = evaluarVitales(ui.draft.vitals, getPaciente(ui.pid));
  cont.innerHTML = alertas.length
    ? alertas.map(a => `<div class="alert ${a.tono}"><b>${a.tono==="crit"?"Alerta":"Precaución"}:</b> ${esc(a.txt)}</div>`).join("")
    : `<div class="alert info">Rangos dentro de los criterios orientativos de seguridad para movilización.</div>`;
}
</script>

<script>
"use strict";

/* ============================================================
   BLOQUES DE ESCALA DENTRO DE LA EVALUACIÓN
   ============================================================ */
function regDe(d, key){
  if(!d.scales[key]) d.scales[key] = SCALES[key].tipo === "tiempo"
    ? {tiempo:"", ayuda:"", asistencia:"", obs:"", noEval:false, motivo:""}
    : {items:{}, noEval:false, motivo:""};
  return d.scales[key];
}

function bloqueEscala(key, d){
  const S = SCALES[key];
  const reg = regDe(d, key);
  const abierto = ESCALAS_PRINCIPALES.includes(key) || key === "mrc";
  return `<details class="acc" data-scale="${key}"${abierto ? " open" : ""}>
    <summary class="acc-head">
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      <span>
        <span class="acc-title">${S.sigla}</span>
        <span class="acc-sub">${esc(S.desc)}</span>
      </span>
      <span class="acc-score" data-score="${key}">—</span>
    </summary>
    <div class="acc-body">
      <div class="noeval-row">
        <input type="checkbox" id="ne-${key}" data-noeval="${key}"${reg.noEval?" checked":""}>
        <label for="ne-${key}" style="cursor:pointer">No se aplica en este control</label>
        <input type="text" data-motivo="${key}" placeholder="Motivo (opcional)" value="${esc(reg.motivo||"")}"
          style="flex:1; min-width:140px; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12.5px"${reg.noEval?"":" hidden"}>
      </div>
      <div data-body="${key}" class="${reg.noEval?"disabled-block":""}">
        ${key === "mrc" ? `<div data-mapa style="margin:12px 0 4px"></div>` : ""}
        ${S.tipo === "tiempo" ? bloqueTUG(reg) : bloqueItems(key, reg)}
        <div class="scale-total" data-total="${key}"></div>
        <p class="footnote" style="margin:10px 0 0"><b>Fuente:</b> ${esc(S.fuente)}</p>
      </div>
    </div>
  </details>`;
}

function bloqueItems(key, reg){
  const S = SCALES[key];
  let html = "", grupoActual = null;
  S.items.forEach((it, i) => {
    if(it.grupo && it.grupo !== grupoActual){
      grupoActual = it.grupo;
      html += `<p class="eyebrow" style="margin:16px 0 2px; color:var(--primary)">${esc(it.grupo)}</p>`;
    }
    const inline = it.opts.length > 4 && it.opts.every(o => String(o[1]).length < 46);
    html += `<div class="item">
      <div class="item-q"><span class="n">${i+1}.</span><span>${esc(it.q)}</span></div>
      <div class="opts${inline?" inline":""}">
        ${it.opts.map(([val,txt]) => {
          const sel = String(reg.items[it.id]) === String(val);
          return `<label class="opt${sel?" sel":""}">
            <input type="radio" name="${key}-${it.id}" value="${val}" data-item="${key}|${it.id}"${sel?" checked":""}>
            <span class="sc">${String(val).replace(".",",")}</span>
            <span>${esc(txt)}</span>
          </label>`;
        }).join("")}
      </div>
      ${key === "ops" && it.id === "cognicion" ? bloqueAMT(reg) : ""}
    </div>`;
  });
  return html;
}

function bloqueAMT(reg){
  const marcados = reg.amt || {};
  const n = Object.values(marcados).filter(Boolean).length;
  return `<details style="margin-top:8px">
    <summary style="font-size:12.5px; font-weight:600; color:var(--primary); cursor:pointer">Aplicar el Test Mental Abreviado (10 preguntas) →</summary>
    <div class="amt">
      ${AMT.map((q,i) => `<label><input type="checkbox" data-amt="${i}"${marcados[i]?" checked":""}><span>${esc(q)}</span></label>`).join("")}
      <p class="small" style="margin:6px 0 0"><b>Puntaje: <span data-amt-total>${n}</span>/10</b> <span class="muted">— al marcar se selecciona automáticamente la categoría cognitiva del OPS.</span></p>
    </div>
  </details>`;
}

function bloqueTUG(reg){
  return `<div class="grid-2" style="margin-top:12px">
    <label class="field">Tiempo <span class="muted" style="font-weight:400">segundos</span>
      <input type="number" step="0.1" min="0" inputmode="decimal" data-tug="tiempo" value="${esc(reg.tiempo)}"></label>
    <label class="field">Ayuda técnica
      <select data-tug="ayuda">${["","Ninguna","Bastón","Bastón de 4 apoyos","Andador / burrito","Órtesis (AFO)","Otra"].map(o=>`<option${o===reg.ayuda?" selected":""}>${o}</option>`).join("")}</select></label>
    <label class="field">Nivel de asistencia
      <select data-tug="asistencia">${["","Independiente","Supervisión","Asistencia mínima","Asistencia moderada","No logra realizar la prueba"].map(o=>`<option${o===reg.asistencia?" selected":""}>${o}</option>`).join("")}</select></label>
    <label class="field" style="grid-column:1/-1">Observaciones<input type="text" data-tug="obs" value="${esc(reg.obs||"")}" placeholder="Giro hacia el lado parético, desequilibrio al sentarse..."></label>
  </div>
  <details style="margin-top:10px">
    <summary style="font-size:12.5px; font-weight:600; color:var(--primary); cursor:pointer">Protocolo estandarizado →</summary>
    <ol class="ref-list" style="margin-top:8px">${SCALES.tug.protocolo.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
  </details>`;
}

function actualizarEscala(key, d){
  const S = SCALES[key];
  const reg = regDe(d, key);
  const total = totalEscala(key, reg);
  const comp = completitud(key, reg);
  const band = interpretar(key, total);

  const score = document.querySelector(`[data-score="${key}"]`);
  if(score){
    score.textContent = reg.noEval ? "n/e" : (total === null ? `${comp.hechos}/${comp.total}` : fmtTotal(key, total));
    score.style.color = reg.noEval ? "var(--ink-3)" : (band ? `var(--${band.tono})` : "var(--ink-2)");
  }

  if(ESCALAS_PRINCIPALES.includes(key)) pintarCargaLive(d);

  if(key === "mrc"){
    const mapa = document.querySelector("[data-mapa]");
    const pac = getPaciente(ui.pid);
    if(mapa && pac) mapa.innerHTML = mapaCorporal(pac, {scales:{mrc:reg}});
  }

  const box = document.querySelector(`[data-total="${key}"]`);
  if(box){
    if(total === null){
      box.innerHTML = `<span class="muted small">${S.tipo==="tiempo" ? "Ingresa el tiempo para calcular la interpretación." : `Faltan ${comp.total - comp.hechos} de ${comp.total} ítems para obtener el puntaje total.`}</span>`;
    } else {
      let extra = "";
      if(key === "pass"){
        const a = subtotalPASS(reg, S.subtotales[0]), b = subtotalPASS(reg, S.subtotales[1]);
        extra = `<span class="pill">A · mantener ${a}/15</span><span class="pill">B · cambiar ${b}/21</span>`;
      }
      if(key === "ops") extra = `<span class="pill">1,6 base + ${(total-1.6).toFixed(1).replace(".",",")} de déficit</span>`;
      if(key === "tug" && total > 14) extra = `<span class="pill crit">&gt; 14 s · riesgo de caídas en ACV</span>`;
      box.innerHTML = `<span class="eyebrow">Total</span>
        <span class="tv">${fmtTotal(key,total)}</span>
        ${S.tipo!=="tiempo" ? `<span class="muted small">/ ${S.max}</span>` : ""}
        <span class="pill ${band?band.tono:""}">${band?esc(band.txt):""}</span>
        ${extra}`;
    }
  }
}

function conectarEscalas(d){
  ["#escalasPrincipales","#escalasExtra"].forEach(sel => {
    const root = $(sel);
    if(!root) return;

    root.addEventListener("change", (e) => {
      const t = e.target;

      if(t.dataset.item){
        const [key, itemId] = t.dataset.item.split("|");
        regDe(d, key).items[itemId] = t.value;
        t.closest(".opts").querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
        t.closest(".opt").classList.add("sel");
        actualizarEscala(key, d);
      }

      if(t.dataset.tug !== undefined && t.dataset.tug !== ""){
        regDe(d, "tug")[t.dataset.tug] = t.value;
        actualizarEscala("tug", d);
      }

      if(t.dataset.noeval){
        const key = t.dataset.noeval;
        const reg = regDe(d, key);
        reg.noEval = t.checked;
        const body = root.querySelector(`[data-body="${key}"]`);
        if(body) body.classList.toggle("disabled-block", t.checked);
        const mot = root.querySelector(`[data-motivo="${key}"]`);
        if(mot) mot.hidden = !t.checked;
        actualizarEscala(key, d);
      }

      if(t.dataset.motivo) regDe(d, t.dataset.motivo).motivo = t.value;

      if(t.dataset.amt !== undefined){
        const reg = regDe(d, "ops");
        reg.amt = reg.amt || {};
        reg.amt[t.dataset.amt] = t.checked;
        const n = Object.values(reg.amt).filter(Boolean).length;
        const out = root.querySelector("[data-amt-total]");
        if(out) out.textContent = n;
        const valor = n === 10 ? "0" : (n >= 8 ? "0.4" : (n >= 5 ? "0.8" : "1.2"));
        const radio = root.querySelector(`input[name="ops-cognicion"][value="${valor}"]`);
        if(radio){
          radio.checked = true;
          reg.items.cognicion = valor;
          radio.closest(".opts").querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
          radio.closest(".opt").classList.add("sel");
        }
        actualizarEscala("ops", d);
      }
    });

    root.addEventListener("input", (e) => {
      if(e.target.dataset.tug === "tiempo"){
        regDe(d, "tug").tiempo = e.target.value;
        actualizarEscala("tug", d);
      }
    });
  });
  ESCALAS_ORDEN.forEach(k => actualizarEscala(k, d));
}
</script>

<script>
"use strict";

/* ============================================================
   ESQUEMA CORPORAL — fuerza por segmento del hemicuerpo afectado
   ============================================================ */
const COLOR_MRC = ["#C0261C","#E0501F","#EF7D15","#D9A400","#2E9270","#0E8558"];
const SIN_DATO  = "#C6D3E4";
const SEGMENTOS = [
  {id:"hombro", nombre:"Hombro",        sub:"Braquial proximal"},
  {id:"codo",   nombre:"Codo",          sub:"Braquial medial"},
  {id:"muneca", nombre:"Muñeca y mano", sub:"Braquial distal"},
  {id:"crural", nombre:"Crural",        sub:"Extremidad inferior"}
];
function colorMRC(v){ return (v === null || v === undefined || v === "") ? SIN_DATO : COLOR_MRC[parseInt(v,10)] || SIN_DATO; }

/* migración de los registros antiguos de 8 grupos a los 4 segmentos clínicos */
function migrarMRC(){
  let cambios = false;
  state.patients.forEach(p => (p.evals||[]).forEach(ev => {
    const reg = (ev.scales||{}).mrc;
    if(!reg || !reg.items) return;
    if(reg.items.m1 === undefined) return;
    const it = reg.items;
    const prom = (a,b) => {
      const va = parseInt(it[a],10), vb = parseInt(it[b],10);
      if(isNaN(va) && isNaN(vb)) return undefined;
      if(isNaN(va)) return String(vb);
      if(isNaN(vb)) return String(va);
      return String(Math.round((va+vb)/2));
    };
    reg.items = {
      hombro: it.m1, codo: prom("m2","m3"), muneca: prom("m4","m5"), crural: prom("m6","m7")
    };
    Object.keys(reg.items).forEach(k => { if(reg.items[k] === undefined) delete reg.items[k]; });
    cambios = true;
  }));
  if(cambios) guardar();
}

function valoresMRC(evalObj){
  const reg = evalObj && (evalObj.scales||{}).mrc;
  const it = (reg && !reg.noEval && reg.items) || {};
  const o = {};
  SEGMENTOS.forEach(s => { o[s.id] = (it[s.id] === undefined || it[s.id] === "") ? null : parseInt(it[s.id],10); });
  return o;
}

/* --- contorno anatómico: curva de Catmull-Rom sobre los puntos de anclaje --- */
function suave(pts, tension){
  const t = tension === undefined ? 0.5 : tension, n = pts.length;
  const P = i => pts[(i % n + n) % n];
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for(let i = 0; i < n; i++){
    const p0 = P(i-1), p1 = P(i), p2 = P(i+1), p3 = P(i+2);
    const c1x = p1[0] + (p2[0]-p0[0])*t/3, c1y = p1[1] + (p2[1]-p0[1])*t/3;
    const c2x = p2[0] - (p3[0]-p1[0])*t/3, c2y = p2[1] - (p3[1]-p1[1])*t/3;
    d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d + "Z";
}

/* mitad derecha del dibujo (desde el vértice del cráneo hasta el pubis) */
const MEDIO = 170;
const PERFIL = [
  [170,19],[191,24],[203,44],[204,63],[197,83],[186,95],[181,107],
  [196,117],[214,124],[232,134],[245,152],[250,177],
  [252,215],[252,258],[251,300],[249,340],
  [253,362],[254,386],[248,403],[240,406],[235,392],[234,360],
  [236,318],[237,258],[236,215],[233,180],[230,167],
  [221,181],[214,212],[209,250],[213,278],[220,300],[226,325],
  [225,355],[221,390],[214,425],[207,456],[204,482],[202,510],
  [197,545],[193,572],[195,590],[201,600],[193,608],[180,607],[174,597],[172,580],
  [178,545],[183,508],[186,470],[185,430],[181,392],[177,366],[170,348]
];
const espejo  = ([x,y]) => [2*MEDIO - x, y];
const CUERPO  = PERFIL.concat(PERFIL.slice(1,-1).reverse().map(espejo));
const PATH_CUERPO = suave(CUERPO, 0.5);

/* regiones de cada segmento (mitad derecha del dibujo; se recortan contra la silueta) */
const REGIONES = {
  hombro: [[204,110],[276,110],[276,264],[231,264],[233,172],[221,177],[209,148]],
  codo:   [[228,264],[276,264],[276,352],[228,352]],
  muneca: [[228,352],[276,352],[276,418],[228,418]],
  crural: [[171,320],[244,320],[244,624],[171,624]]
};
const poli = (pts, invertir) =>
  (invertir ? pts.map(espejo) : pts).map(q => q.join(",")).join(" ");

function svgCuerpo(lado, val){
  const izq = lado === "Izquierdo" || lado === "Bilateral";
  const der = lado === "Derecho"   || lado === "Bilateral";
  const BASE = "#E9EFF7", TRAZO = "#2C3E56";

  /* relleno de cada segmento del lado afectado */
  const pintar = (invertir) => SEGMENTOS.map(s => {
    const v = val[s.id];
    const relleno = v === null ? "url(#pendiente)" : colorMRC(v);
    return `<polygon points="${poli(REGIONES[s.id], invertir)}" fill="${relleno}"/>`;
  }).join("");

  /* líneas que separan proximal / medial / distal y el segmento crural */
  const cortes = (inv) => {
    const L = (x1,y1,x2,y2) => {
      const a = inv ? espejo([x1,y1]) : [x1,y1], b = inv ? espejo([x2,y2]) : [x2,y2];
      return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#fff" stroke-width="3" opacity=".9"/>`;
    };
    return L(226,264,276,260) + L(228,352,276,348) + L(171,322,246,316);
  };

  const marcador = (seg, y, destinoX, mx) => {
    const v = val[seg], col = colorMRC(v);
    const s = SEGMENTOS.find(z => z.id === seg);
    return `
      <line x1="${mx}" y1="${y}" x2="${destinoX}" y2="${y}" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 4" opacity=".85"/>
      <circle cx="${mx}" cy="${y}" r="17" fill="${v===null?"#FFFFFF":col}" stroke="${col}" stroke-width="2.5"/>
      <text x="${mx}" y="${y+5}" text-anchor="middle" fill="${v===null?col:"#fff"}" font-size="15" font-weight="700"
        font-family="IBM Plex Mono, monospace">M${v===null?"?":v}</text>
      <text x="${mx}" y="${y+31}" text-anchor="middle" fill="var(--ink-2)" font-size="10" font-weight="600"
        font-family="IBM Plex Sans, sans-serif">${s.nombre}</text>`;
  };
  const columna = (inv) => {
    const mx = inv ? 46 : 294;
    const dx = (x) => inv ? 2*MEDIO - x : x;
    return marcador("hombro",178,dx(248),mx) + marcador("codo",300,dx(250),mx)
         + marcador("muneca",386,dx(246),mx) + marcador("crural",472,dx(212),mx);
  };

  return `<svg class="mapa-svg" viewBox="0 0 340 625" role="img"
      aria-label="Esquema corporal: hemicuerpo ${esc(lado||"no definido").toLowerCase()}, fuerza MRC por segmento">
    <defs>
      <clipPath id="recorteCuerpo"><path d="${PATH_CUERPO}"/></clipPath>
      <pattern id="pendiente" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="8" height="8" fill="#F4F7FB"/><rect width="3" height="8" fill="#C6D3E4"/>
      </pattern>
    </defs>

    <text x="84" y="15" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1"
      font-family="IBM Plex Sans, sans-serif" fill="${der?"var(--crit)":"var(--ink-3)"}">DERECHA</text>
    <text x="256" y="15" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1"
      font-family="IBM Plex Sans, sans-serif" fill="${izq?"var(--crit)":"var(--ink-3)"}">IZQUIERDA</text>

    <path d="${PATH_CUERPO}" fill="${BASE}"/>
    <g clip-path="url(#recorteCuerpo)">
      ${der ? pintar(true)  + cortes(true)  : ""}
      ${izq ? pintar(false) + cortes(false) : ""}
    </g>
    <path d="${PATH_CUERPO}" fill="none" stroke="${TRAZO}" stroke-width="2" stroke-linejoin="round"/>

    ${der ? columna(true) : ""}
    ${izq ? columna(false) : ""}
  </svg>`;
}

function mapaCorporal(p, evalObj){
  const val = valoresMRC(evalObj);
  const lado = p.ladoAfectado || "";
  const definido = lado && lado !== "Sin compromiso motor";
  const filas = SEGMENTOS.map(s => {
    const v = val[s.id];
    return `<div class="seg-row">
      <span class="seg-dot" style="background:${colorMRC(v)}">M${v===null?"?":v}</span>
      <span><span class="seg-name">${s.nombre}</span><br><span class="seg-sub">${s.sub}</span></span>
      <span class="spacer"></span>
      <span class="num small muted">${v===null?"sin registro":"M"+v+" de M5"}</span>
    </div>`;
  }).join("");

  return `<div class="mapa-wrap">
    <div>
      ${definido ? svgCuerpo(lado, val) : svgCuerpo("", val)}
      <p class="footnote" style="text-align:center; margin:2px 0 0">Vista anterior · el paciente mira hacia ti</p>
    </div>
    <div style="display:grid; gap:12px">
      <span class="lado-badge ${definido?"":"neutro"}">
        ${definido ? (lado === "Bilateral" ? "Compromiso bilateral" : "Hemicuerpo " + lado.toLowerCase() + " afectado") : "Define el hemicuerpo afectado en la ficha"}
      </span>
      <div class="seg-list">${filas}</div>
      <div class="ramp">
        <span>M0</span>${COLOR_MRC.map(c => `<i style="background:${c}"></i>`).join("")}<span>M5</span>
        <span style="margin-left:6px">sin contracción → fuerza normal</span>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   CRONÓMETRO
   ============================================================ */
const Chrono = {
  t0:0, acum:0, corriendo:false, modo:"up", objetivo:0, sonado:false, vueltas:[], raf:null,

  abrir(){ $("#chronoPanel").hidden = false; $("#chronoFab").hidden = true; Chrono.pintar(); },
  cerrar(){ $("#chronoPanel").hidden = true; $("#chronoFab").hidden = false; },

  ms(){
    const t = Chrono.acum + (Chrono.corriendo ? (performance.now() - Chrono.t0) : 0);
    return Chrono.modo === "down" ? Math.max(0, Chrono.objetivo - t) : t;
  },
  fmt(ms){
    const cs = Math.floor(ms / 10) % 100;
    const s  = Math.floor(ms / 1000) % 60;
    const m  = Math.floor(ms / 60000);
    const dd = (x,n) => String(x).padStart(n,"0");
    return (m > 0 ? dd(m,2) + ":" : "") + dd(s,2) + "," + dd(cs,2);
  },
  iniciar(){
    if(Chrono.corriendo){
      Chrono.acum += performance.now() - Chrono.t0; Chrono.corriendo = false;
      soltarBloqueoPantalla();
    } else {
      Chrono.t0 = performance.now(); Chrono.corriendo = true; Chrono.bucle();
      pedirBloqueoPantalla();
    }
    vibrar();
    Chrono.pintar();
  },
  reiniciar(){ Chrono.acum = 0; Chrono.corriendo = false; Chrono.sonado = false; Chrono.vueltas = [];
    soltarBloqueoPantalla(); Chrono.pintar(); },
  preset(seg){
    Chrono.modo = seg ? "down" : "up";
    Chrono.objetivo = seg * 1000;
    Chrono.reiniciar();
  },
  vuelta(){ Chrono.vueltas.unshift(Chrono.fmt(Chrono.ms())); Chrono.pintar(); },
  bucle(){
    if(!Chrono.corriendo) return;
    Chrono.pintar();
    Chrono.raf = requestAnimationFrame(Chrono.bucle);
  },
  alarma(){
    if(Chrono.sonado) return;
    Chrono.sonado = true;
    try{ if(navigator.vibrate) navigator.vibrate([180,90,180]); }catch(e){}
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.28].forEach(d => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, ctx.currentTime + d);
        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.2);
        o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.22);
      });
    }catch(e){}
    const disp = $("#chronoDisp");
    if(disp){ disp.classList.add("parpadea"); setTimeout(() => disp.classList.remove("parpadea"), 2800); }
  },
  pintar(){
    const disp = $("#chronoDisp"); if(!disp) return;
    const ms = Chrono.ms();
    disp.textContent = Chrono.fmt(ms);
    disp.classList.toggle("corriendo", Chrono.corriendo && !(Chrono.modo === "down" && ms === 0));
    disp.classList.toggle("alarma", Chrono.modo === "down" && ms === 0);
    if(Chrono.modo === "down" && ms === 0 && Chrono.corriendo){
      Chrono.corriendo = false; soltarBloqueoPantalla(); Chrono.alarma(); }

    $("#chronoPlay").textContent = Chrono.corriendo ? "Pausar" : "Iniciar";
    $("#chronoSub").textContent = Chrono.modo === "down"
      ? `Cuenta regresiva de ${Chrono.objetivo/1000} s`
      : "Cronómetro libre — TUG";
    document.querySelectorAll("#chronoPre button").forEach(b =>
      b.classList.toggle("on", parseInt(b.dataset.seg,10) * 1000 === Chrono.objetivo && (Chrono.modo === "down") === (b.dataset.seg !== "0")));
    const v = $("#chronoVueltas");
    v.innerHTML = Chrono.vueltas.map((x,i) => `<div>${Chrono.vueltas.length-i}. ${x}</div>`).join("");
    const envia = $("#chronoTug");
    envia.hidden = !(ui.view === "evaluacion" && ui.draft && Chrono.modo === "up");
  },
  aTUG(){
    if(!(ui.view === "evaluacion" && ui.draft)) return;
    const seg = (Chrono.ms() / 1000).toFixed(1);
    regDe(ui.draft, "tug").tiempo = seg;
    const input = document.querySelector('[data-tug="tiempo"]');
    if(input) input.value = seg;
    const reg = regDe(ui.draft, "tug");
    if(reg.noEval){
      reg.noEval = false;
      const chk = document.querySelector('[data-noeval="tug"]');
      if(chk){ chk.checked = false; }
      const body = document.querySelector('[data-body="tug"]');
      if(body) body.classList.remove("disabled-block");
    }
    actualizarEscala("tug", ui.draft);
    const det = document.querySelector('details[data-scale="tug"]');
    if(det){ det.open = true; det.scrollIntoView({behavior:"smooth", block:"center"}); }
    $("#chronoSub").textContent = `${seg.replace(".",",")} s enviados al TUG ✓`;
  }
};

(function montarChrono(){
  const fab = el("button", {className:"fab", id:"chronoFab", title:"Cronómetro"});
  fab.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M19 5l1.5 1.5"/></svg>`;
  fab.onclick = Chrono.abrir;

<script>
"use strict";

/* ============================================================
   CATEGORIZACIÓN DE CARGA DE REHABILITACIÓN
   Protocolo interno del equipo de kinesiología · servicio UTAC
   Cada escala aporta 1, 2 o 3 puntos. Total 4 a 12.
   ============================================================ */

const TABLA_CARGA = [
  {key:"pass", rangos:["25 a 36",   "13 a 24",   "0 a 12"]},
  {key:"ops",  rangos:["1,6 a 3,2", "3,2 a 5,2", "5,2 a 6,8"]},
  {key:"tct",  rangos:["67 a 100",  "34 a 66",   "0 a 33"]},
  {key:"tug",  rangos:["0 a 8 s",   "9 a 15 s",  "16 s o más"]}
];

const CATEGORIAS_CARGA = [
  {id:"baja",    nombre:"Baja carga",    corto:"Baja",    tono:"ok",   rango:"4 puntos",      max:4},
  {id:"mediana", nombre:"Mediana carga", corto:"Mediana", tono:"warn", rango:"5 a 8 puntos",  max:8},
  {id:"alta",    nombre:"Alta carga",    corto:"Alta",    tono:"crit", rango:"9 a 12 puntos", max:12}
];

/* Regla de borde: se lee la fila de izquierda a derecha y gana la primera columna
   que contiene el valor (por eso OPS 3,2 → 1 punto y OPS 5,2 → 2 puntos).
   Escala no aplicada o incompleta → 3 puntos, según acuerdo del servicio. */
function puntosCarga(key, valor){
  if(valor === null || valor === undefined) return 3;
  const v = Number(valor);
  if(!Number.isFinite(v)) return 3;
  switch(key){
    case "pass": return v >= 25  ? 1 : (v >= 13  ? 2 : 3);
    case "tct":  return v >= 67  ? 1 : (v >= 34  ? 2 : 3);
    case "ops":  return v <= 3.2 ? 1 : (v <= 5.2 ? 2 : 3);
    case "tug":  return v <= 8   ? 1 : (v <= 15  ? 2 : 3);
  }
  return 3;
}

function calcularCarga(evalObj){
  const detalle = ESCALAS_PRINCIPALES.map(k => {
    const reg = ((evalObj && evalObj.scales) || {})[k];
    const valor = totalEscala(k, reg);
    const noAplica = !!(reg && reg.noEval);
    return {
      key:k, sigla:SCALES[k].sigla, valor:valor,
      puntos: puntosCarga(k, valor),
      noAplica: noAplica,
      pendiente: valor === null && !noAplica
    };
  });
  const total = detalle.reduce((a,d) => a + d.puntos, 0);
  const cat = CATEGORIAS_CARGA.find(c => total <= c.max) || CATEGORIAS_CARGA[2];
  return { total, cat, detalle, pendientes: detalle.filter(d => d.pendiente).length };
}

const COLOR_PTS = {1:"var(--ok)", 2:"var(--warn)", 3:"var(--crit)"};

function cargaHTML(res, enVivo){
  const provisional = res.pendientes > 0;
  const filas = res.detalle.map(d => {
    const S = SCALES[d.key];
    let valorTxt;
    if(d.valor !== null) valorTxt = fmtTotal(d.key, d.valor);
    else if(d.noAplica)  valorTxt = '<span class="pill crit">no se aplica → 3 pts</span>';
    else                 valorTxt = '<span class="muted">pendiente</span>';
    return `<tr>
      <td><b>${S.sigla}</b></td>
      <td class="num">${valorTxt}</td>
      <td style="text-align:right"><span class="carga-pts" style="background:${COLOR_PTS[d.puntos]}">${d.puntos}</span></td>
    </tr>`;
  }).join("");

  const pos = Math.max(0, Math.min(1, (res.total - 4) / 8)) * 100;

  return `
    <div class="carga-hero">
      <div class="carga-sello ${provisional ? "pend" : res.cat.tono}">
        <span class="cs-cat">${provisional ? "Provisorio" : res.cat.nombre}</span>
        <span class="cs-pts">${res.total} / 12 puntos</span>
      </div>
      <div class="carga-barra">
        <div class="cb-track">
          <span class="cb-seg s1 ${!provisional && res.cat.id==="baja"?"on":""}"></span>
          <span class="cb-seg s2 ${!provisional && res.cat.id==="mediana"?"on":""}"></span>
          <span class="cb-seg s3 ${!provisional && res.cat.id==="alta"?"on":""}"></span>
        </div>
        <div class="cb-esc"><span>4 · baja</span><span>5–8 · mediana</span><span>9–12 · alta</span></div>
        <div style="margin-top:7px; font-size:12px; color:var(--ink-2)">
          ${provisional
            ? `Faltan <b>${res.pendientes}</b> escala(s) por completar o marcar como no aplicable. El puntaje mostrado ya les asigna 3 puntos.`
            : `Posición en el rango: <b class="num">${res.total}</b> de 12 · ${esc(res.cat.rango)}`}
        </div>
      </div>
    </div>
    <div class="scroll-x" style="margin-top:14px">
      <table class="carga-tabla">
        <thead><tr><th>Escala</th><th>Valor</th><th style="text-align:right">Puntos</th></tr></thead>
        <tbody>${filas}</tbody>
        <tfoot><tr style="border-top:2px solid var(--line-2)">
          <td colspan="2"><b>Total</b></td>
          <td style="text-align:right"><b class="num" style="font-size:15px">${res.total}</b></td>
        </tr></tfoot>
      </table>
    </div>
    ${enVivo ? "" : `<p class="footnote" style="margin:10px 0 0">Protocolo interno del equipo de kinesiología de la UTAC. La categoría orienta la asignación de carga de rehabilitación; la indicación final es del equipo tratante.</p>`}`;
}

function historialCarga(p){
  const evs = evalsOrdenadas(p);
  if(evs.length < 2) return "";
  const pasos = evs.map(ev => {
    const r = calcularCarga(ev);
    return `<span class="pill ${r.cat.tono}">${fFecha(ev.fecha).slice(0,5)} · ${r.cat.corto} <b>${r.total}</b></span>`;
  }).join('<span class="muted">→</span>');
  const prim = calcularCarga(evs[0]), ult = calcularCarga(evs[evs.length-1]);
  const cambio = prim.cat.id !== ult.cat.id;
  return `<div style="margin-top:14px">
    <p class="eyebrow" style="margin-bottom:7px">Evolución de la categoría</p>
    <div class="carga-hist">${pasos}</div>
    ${cambio ? `<p class="small" style="margin:8px 0 0; color:var(--${ult.cat.tono}); font-weight:600">
      Cambió de ${prim.cat.nombre.toLowerCase()} a ${ult.cat.nombre.toLowerCase()} desde el ingreso.</p>` : ""}
  </div>`;
}

function pintarCargaLive(d){
  const cont = document.getElementById("cargaLive");
  if(cont) cont.innerHTML = cargaHTML(calcularCarga(d), true);
}
</script>
