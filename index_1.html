<script>
"use strict";

/* ============================================================
   CALCULADORA RÁPIDA DE CARGA
   Para quien ya aplicó las escalas y solo necesita el puntaje.
   ============================================================ */

const LIMITES_CALC = {
  pass:{min:0, max:36,  paso:1,   unidad:"puntos", ayuda:"0 a 36"},
  ops: {min:1.6, max:6.8, paso:0.1, unidad:"puntos", ayuda:"1,6 a 6,8"},
  tct: {min:0, max:100, paso:1,   unidad:"puntos", ayuda:"0 a 100"},
  tug: {min:0, max:600, paso:0.1, unidad:"segundos", ayuda:"segundos"}
};

let calc = { valores:{pass:"", ops:"", tct:"", tug:""}, noAplica:{}, guardar:false };

function calcEval(){
  const scales = {};
  ESCALAS_PRINCIPALES.forEach(k => {
    const v = calc.valores[k];
    const valido = calcValido(k, v);
    scales[k] = {
      totalDirecto: (calc.noAplica[k] || !valido) ? "" : v,
      noEval: !!calc.noAplica[k],
      motivo: calc.noAplica[k] ? "No aplicable — ingreso rápido" : ""
    };
  });
  return { scales };
}
function calcValido(k, v){
  if(v === "" || v === null || v === undefined) return false;
  const n = parseFloat(String(v).replace(",", "."));
  if(!Number.isFinite(n)) return false;
  const L = LIMITES_CALC[k];
  return n >= L.min && n <= L.max;
}

function renderCalculadora(){
  const v = $("#view-calculadora");
  const pacientes = state.patients;

  v.innerHTML = `
    <div>
      <p class="eyebrow">Ingreso rápido de puntajes</p>
      <h1 style="font-size:24px">Calculadora de carga</h1>
      <p class="small muted" style="margin:6px 0 0; max-width:64ch">Para quien ya aplicó las escalas y solo necesita la categoría. Escribe los cuatro puntajes y la carga de rehabilitación se calcula al instante, con la misma tabla del servicio.</p>
    </div>

    <div class="card card-pad">
      <div class="calc-grid" id="calcCampos">
        ${ESCALAS_PRINCIPALES.map(k => campoCalc(k)).join("")}
      </div>
      <div class="row" style="margin-top:14px">
        <button class="btn ghost sm" id="calcLimpiar">Limpiar</button>
        <span class="spacer"></span>
        <span class="small muted">Marca «no aplicable» y se le asignan 3 puntos, igual que en el protocolo.</span>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Resultado</h2><span class="spacer"></span><span class="small muted">protocolo UTAC</span></div>
      <div class="card-pad" id="calcResultado"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Guardar en un paciente</h2><span class="spacer"></span>
        <span class="small muted">opcional</span></div>
      <div class="card-pad">
        <p class="small muted" style="margin:0 0 12px">Si quieres dejar registro y seguir la evolución, guarda este cálculo como una evaluación. Queda marcado como «puntajes directos», sin el detalle ítem por ítem.</p>
        <div class="grid-2">
          <label class="field">Paciente
            <select id="calcPaciente">
              <option value="">— solo calcular, no guardar —</option>
              ${pacientes.map(p => `<option value="${p.id}">${esc(p.iniciales || "sin iniciales")} · ${esc(p.cama || "s/cama")}</option>`).join("")}
              <option value="__nuevo__">+ Paciente nuevo</option>
            </select></label>
          <label class="field">Fecha<input type="date" id="calcFecha" value="${hoy()}"></label>
          <label class="field">Momento
            <select id="calcTipo">${["Control 7 días","Ingreso","Control extraordinario","Egreso / traslado"].map(t=>`<option>${t}</option>`).join("")}</select></label>
          <label class="field">Evaluador/a<input type="text" id="calcEvaluador" placeholder="Iniciales o nombre"></label>
        </div>
        <div class="grid-2" id="calcNuevo" hidden style="margin-top:12px">
          <label class="field">Iniciales del paciente<input type="text" id="calcIniciales" maxlength="6" placeholder="J.P.M."></label>
          <label class="field">Cama
            <select id="calcCama"><option value="">— sin asignar —</option>${CAMAS.map(c=>`<option>${c}</option>`).join("")}</select></label>
        </div>
        <div class="row" style="margin-top:14px">
          <button class="btn" id="calcGuardar" disabled>Guardar evaluación</button>
          <span class="small" id="calcAviso" style="color:var(--ink-3)">Elige un paciente para habilitar el guardado.</span>
        </div>
      </div>
    </div>`;

  $("#calcCampos").addEventListener("input", (e) => {
    const k = e.target.dataset.calc;
    if(k){ calc.valores[k] = e.target.value; pintarCalc(); }
  });
  $("#calcCampos").addEventListener("change", (e) => {
    const k = e.target.dataset.na;
    if(k){
      calc.noAplica[k] = e.target.checked;
      const inp = document.querySelector(`[data-calc="${k}"]`);
      if(inp){ inp.disabled = e.target.checked; if(e.target.checked) inp.value = ""; }
      if(e.target.checked) calc.valores[k] = "";
      pintarCalc();
    }
  });
  $("#calcLimpiar").onclick = () => {
    calc = { valores:{pass:"", ops:"", tct:"", tug:""}, noAplica:{}, guardar:false };
    renderCalculadora();
  };
  $("#calcPaciente").onchange = (e) => {
    $("#calcNuevo").hidden = e.target.value !== "__nuevo__";
    actualizarBotonGuardar();
  };
  $("#calcGuardar").onclick = guardarCalculo;

  pintarCalc();
}

function campoCalc(k){
  const S = SCALES[k], L = LIMITES_CALC[k];
  return `<div class="calc-campo" data-campo="${k}">
    <div class="calc-top">
      <span class="calc-sigla">${S.sigla}</span>
      <span class="calc-nom">${L.ayuda}</span>
      <span class="calc-pts" data-pts="${k}">–</span>
    </div>
    <input type="number" inputmode="decimal" data-calc="${k}" step="${L.paso}" min="${L.min}" max="${L.max}"
      placeholder="—" value="${esc(calc.valores[k])}"${calc.noAplica[k] ? " disabled" : ""}>
    <div class="calc-rangos" data-rangos="${k}"></div>
    <label class="calc-na"><input type="checkbox" data-na="${k}"${calc.noAplica[k] ? " checked" : ""}> No aplicable → 3 puntos</label>
    <div class="calc-msg" data-msg="${k}"></div>
  </div>`;
}

function pintarCalc(){
  const ev = calcEval();
  ESCALAS_PRINCIPALES.forEach(k => {
    const val = calc.valores[k];
    const na = !!calc.noAplica[k];
    const valido = calcValido(k, val);
    const vacio = val === "" || val === null;
    const campo = document.querySelector(`[data-campo="${k}"]`);
    const msg = document.querySelector(`[data-msg="${k}"]`);
    const pts = document.querySelector(`[data-pts="${k}"]`);
    const rangos = document.querySelector(`[data-rangos="${k}"]`);
    if(!campo) return;

    const listo = na || valido;
    campo.classList.toggle("lista", listo);
    campo.classList.toggle("error", !vacio && !valido && !na);
    msg.textContent = (!vacio && !valido && !na) ? `Fuera de rango (${LIMITES_CALC[k].ayuda})` : "";

    const p = listo ? puntosCarga(k, na ? null : parseFloat(String(val).replace(",", "."))) : null;
    pts.textContent = p === null ? "–" : p;
    pts.style.background = p === null ? "var(--line-2)" : COLOR_PTS[p];

    const fila = TABLA_CARGA.find(t => t.key === k);
    rangos.innerHTML = fila.rangos.map((r, i) => {
      const act = p === (i + 1);
      return `<span class="${act ? "act" : ""}" style="${act ? `background:${COLOR_PTS[i+1]}` : ""}">${r}</span>`;
    }).join("");
  });

  const res = calcularCarga(ev);
  $("#calcResultado").innerHTML = cargaHTML(res, false);
  actualizarBotonGuardar();
}

function actualizarBotonGuardar(){
  const btn = $("#calcGuardar"), sel = $("#calcPaciente"), aviso = $("#calcAviso");
  if(!btn) return;
  const res = calcularCarga(calcEval());
  const completo = res.pendientes === 0;
  const hayPaciente = sel.value !== "";
  btn.disabled = !(completo && hayPaciente);
  if(!completo)          { aviso.textContent = "Completa las cuatro escalas para poder guardar."; aviso.style.color = "var(--warn)"; }
  else if(!hayPaciente)  { aviso.textContent = "Elige un paciente para habilitar el guardado."; aviso.style.color = "var(--ink-3)"; }
  else                   { aviso.textContent = "Listo para guardar."; aviso.style.color = "var(--ok)"; }
}

function guardarCalculo(){
  const sel = $("#calcPaciente").value;
  let p;
  if(sel === "__nuevo__"){
    const ini = $("#calcIniciales").value.trim();
    if(!ini){ alert("Escribe al menos las iniciales del paciente."); return; }
    p = { id: uid(), iniciales: ini, cama: $("#calcCama").value, edad:"", sexo:"",
          fechaIngreso: $("#calcFecha").value, tipoACV:"", subtipo:"", ladoAfectado:"",
          nihss:"", nihssFecha:"", antecedentes:"", kine: $("#calcEvaluador").value, evals:[] };
    state.patients.push(p);
  } else {
    p = getPaciente(sel);
    if(!p){ alert("No se encontró el paciente."); return; }
  }

  const base = calcEval();
  const ev = {
    id: uid(), fecha: $("#calcFecha").value || hoy(), tipo: $("#calcTipo").value,
    evaluador: $("#calcEvaluador").value, modo: "rapido",
    vitals:{pas:"",pad:"",fc:"",spo2:"",fr:""},
    scales: base.scales,
    notas: "Puntajes ingresados directamente desde la calculadora de carga."
  };
  p.evals = p.evals || [];
  p.evals.push(ev);
  state.demo = false;
  guardar();

  calc = { valores:{pass:"", ops:"", tct:"", tug:""}, noAplica:{}, guardar:false };
  irA("paciente", p.id);
}
</script>

<style>
/* ---------- criterios de movilización ---------- */
.crit-box{display:grid; gap:10px}
.crit-head{display:flex; gap:9px; align-items:center; flex-wrap:wrap}

  background:var(--primary-soft); border-radius:8px; padding:5px 11px;
}

<style>
/* ---------- terapia de reperfusión ---------- */
.rep-chips{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.rep-chip{
  border:1px solid var(--line-2); border-radius:var(--r); padding:12px 14px; background:var(--surface-2);
  display:grid; gap:4px; border-left:4px solid var(--primary);
}
.rep-chip.vacio{border-left-color:var(--line-2); opacity:.72}
.rep-chip .rc-tit{font-family:var(--display); font-weight:700; font-size:14.5px}
.rep-chip .rc-mom{font-family:var(--mono); font-size:15px; font-weight:600; color:var(--ink)}
.rep-chip .rc-sub{font-size:11.5px; color:var(--ink-3)}
.rep-chip .rc-desde{font-size:12px; font-weight:600}
.rep-nula{padding:12px 14px; border-radius:var(--r); background:var(--surface-2); border:1px dashed var(--line-2); font-size:13px; color:var(--ink-2)}
.rep-tiempos{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
</style>

<script>
"use strict";

/* ============================================================
   TERAPIA DE REPERFUSIÓN — trombólisis y trombectomía
   ============================================================ */

const REPERFUSION = [
  "", "Sin terapia de reperfusión", "Trombólisis intravenosa",
  "Trombectomía mecánica", "Trombólisis + trombectomía (terapia puente)", "Se desconoce"
];
const conTrombolisis  = (t) => t === "Trombólisis intravenosa" || t === "Trombólisis + trombectomía (terapia puente)";
const conTrombectomia = (t) => t === "Trombectomía mecánica"   || t === "Trombólisis + trombectomía (terapia puente)";

function aFechaHora(f, h){
  if(!f) return null;
  const d = new Date(f + "T" + (h && h.length >= 4 ? h : "00:00"));
  return isNaN(d.getTime()) ? null : d;
}
function horasDesde(f, h){
  const d = aFechaHora(f, h);
  return d === null ? null : (Date.now() - d.getTime()) / 3600000;
}
function fmtTranscurrido(hs){
  if(hs === null) return "—";
  if(hs < 0) return "fecha futura";
  if(hs < 48) return hs.toFixed(1).replace(".", ",") + " h";
  const d = Math.floor(hs / 24);
  return d + (d === 1 ? " día" : " días");
}
function fmtIntervalo(min){
  if(min === null || min < 0) return "—";
  const h = Math.floor(min / 60), m = Math.round(min % 60);
  return h > 0 ? `${h} h ${String(m).padStart(2,"0")} min` : `${m} min`;
}
function minutosEntre(f1, h1, f2, h2){
  const a = aFechaHora(f1, h1), b = aFechaHora(f2, h2);
  if(!a || !b) return null;
  return (b.getTime() - a.getTime()) / 60000;
}
function fmtMomento(f, h){
  if(!f) return "sin registro";
  return fFecha(f) + (h ? " · " + h + " h" : "");
}

function tarjetaReperfusion(p){
  const tipo = p.reperfusion || "";
  const tl = conTrombolisis(tipo), tm = conTrombectomia(tipo);

  if(!tipo) return `<p class="muted small">Indica si el paciente recibió terapia de reperfusión para registrar sus horarios.</p>`;
  if(tipo === "Sin terapia de reperfusión" || tipo === "Se desconoce")
    return `<div class="rep-nula">${esc(tipo)}. No hay horarios que registrar.</div>`;

  const chip = (titulo, f, h, sub) => {
    const hs = horasDesde(f, h);
    const vacio = !f;
    return `<div class="rep-chip ${vacio ? "vacio" : ""}">
      <span class="rc-tit">${titulo}</span>
      <span class="rc-mom">${fmtMomento(f, h)}</span>
      <span class="rc-sub">${esc(sub)}</span>
      ${!vacio ? `<span class="rc-desde" style="color:${hs !== null && hs < 24 ? "var(--crit)" : "var(--ink-2)"}">
        Hace ${fmtTranscurrido(hs)}</span>` : `<span class="rc-desde muted">Registra fecha y hora</span>`}
    </div>`;
  };

  let html = `<div class="rep-chips">`;
  if(tl) html += chip("Trombólisis intravenosa", p.tlFecha, p.tlHora, "Inicio de la infusión");
  if(tm) html += chip("Trombectomía mecánica", p.tmFecha, p.tmHora, "Punción arterial / recanalización");
  html += `</div>`;

  /* intervalos desde el inicio de los síntomas */
  const tiempos = [];
  if(tl && p.inicioFecha && p.tlFecha){
    const m = minutosEntre(p.inicioFecha, p.inicioHora, p.tlFecha, p.tlHora);
    if(m !== null) tiempos.push(`<span class="pill primary">Inicio → aguja: ${fmtIntervalo(m)}</span>`);
  }
  if(tm && p.inicioFecha && p.tmFecha){
    const m = minutosEntre(p.inicioFecha, p.inicioHora, p.tmFecha, p.tmHora);
    if(m !== null) tiempos.push(`<span class="pill primary">Inicio → punción: ${fmtIntervalo(m)}</span>`);
  }
  if(tiempos.length) html += `<div class="rep-tiempos">${tiempos.join("")}</div>`;

  /* ventana de precaución */
  const hsInicio = p.inicioFecha ? horasDesde(p.inicioFecha, p.inicioHora) : null;
  const hsTL = tl && p.tlFecha ? horasDesde(p.tlFecha, p.tlHora) : null;
  const hsTM = tm && p.tmFecha ? horasDesde(p.tmFecha, p.tmHora) : null;
  const avisos = [];

  if(hsInicio !== null && hsInicio >= 0 && hsInicio < 24){
    avisos.push(`<div class="alert crit" style="margin-top:12px"><span>
      <b>Primeras 24 h desde el inicio de los síntomas (${fmtTranscurrido(hsInicio)}).</b><br>
      Las guías recomiendan <b>no iniciar movilización intensa</b> — entendida como sesiones más frecuentes y prolongadas que el cuidado habitual — en este período.
      Esto no equivale a reposo absoluto: la movilización breve y frecuente, y la del paciente que deambula por sí mismo tras un ACV leve, no está contraindicada.</span></div>`);
  }
  const hsMin = [hsTL, hsTM].filter(x => x !== null && x >= 0).sort((a,b) => a-b)[0];
  if(hsMin !== undefined && hsMin < 24){
    avisos.push(`<div class="alert warn" style="margin-top:10px"><span>
      <b>Menos de 24 h desde la terapia de reperfusión (${fmtTranscurrido(hsMin)}).</b><br>
      Revisa el protocolo local antes de progresar la movilización: habitualmente se realiza imagen de control a las 24 h y existen precauciones institucionales propias en este período.</span></div>`);
  }
  html += avisos.join("");
  html += `<p class="footnote" style="margin:12px 0 0">La recomendación sobre movilización intensa en las primeras 24 h proviene de la guía NICE de ACV, basada principalmente en el ensayo AVERT III. Las precauciones post-reperfusión son institucionales y las define el servicio.</p>`;
  return html;
}


/* ============================================================
   CRITERIOS DE MOVILIZACIÓN — protocolo del servicio UTAC
   Límites de presión arterial y ventana de espera, según
   tipo de ACV y terapia de reperfusión recibida.
   ============================================================ */
function criteriosMovilizacion(p){
  const tipo = (p && p.tipoACV) || "";
  const rep  = (p && p.reperfusion) || "";
  const hemo = /hemorr|subaracnoidea/i.test(tipo);

  if(hemo) return {
    id:"hemorragico", etiqueta:"ACV hemorrágico", pas:140, pad:90,
    espera:{min:48, max:72, ref:"inicio", texto:"48 a 72 h desde el ACV", refTxt:"el inicio del ACV"}
  };

  const tl = conTrombolisis(rep), tm = conTrombectomia(rep);

  if(tl && tm) return {
    id:"puente", etiqueta:"ACV isquémico con terapia puente", pas:180, pad:105,
    espera:{min:24, ref:"ultimo", texto:"24 h desde el último procedimiento", refTxt:"el último procedimiento"},
    nota:"Con trombólisis y trombectomía se aplica el criterio más estricto de ambos (180/105)."
  };
  if(tm) return {
    id:"trombectomia", etiqueta:"ACV isquémico con trombectomía mecánica", pas:180, pad:105,
    espera:{min:24, ref:"tm", texto:"24 h post trombectomía", refTxt:"la trombectomía"}
  };
  if(tl) return {
    id:"trombolisis", etiqueta:"ACV isquémico trombolizado", pas:185, pad:110,
    espera:{min:24, ref:"tl", texto:"24 h post trombólisis", refTxt:"la trombólisis"}
  };

  return {
    id:"isquemico", etiqueta:"ACV isquémico sin reperfusión", pas:220, pad:110, espera:null,
    indefinido: !tipo
  };
}

function horasReferencia(p, cr){
  if(!cr.espera) return null;
  const r = cr.espera.ref;
  if(r === "tl") return horasDesde(p.tlFecha, p.tlHora);
  if(r === "tm") return horasDesde(p.tmFecha, p.tmHora);
  if(r === "ultimo"){
    const xs = [horasDesde(p.tlFecha, p.tlHora), horasDesde(p.tmFecha, p.tmHora)].filter(x => x !== null);
    return xs.length ? Math.min.apply(null, xs) : null;
  }
  if(r === "inicio"){
    const a = horasDesde(p.inicioFecha, p.inicioHora);
    return a !== null ? a : horasDesde(p.fechaIngreso, "");
  }
  return null;
}

function estadoEspera(p){
  const cr = criteriosMovilizacion(p);
  if(!cr.espera) return {cr, aplica:false};
  const hs = horasReferencia(p, cr);
  if(hs === null || hs < 0)
    return {cr, aplica:true, estado:"sindato", hs:null,
            txt:`Falta registrar la fecha y hora de ${cr.espera.refTxt} para calcular la ventana.`};
  if(hs < cr.espera.min)
    return {cr, aplica:true, estado:"no", hs,
            txt:`Faltan ${fmtTranscurrido(cr.espera.min - hs)} para cumplir ${cr.espera.texto}.`};
  if(cr.espera.max && hs < cr.espera.max)
    return {cr, aplica:true, estado:"parcial", hs,
            txt:`Han pasado ${fmtTranscurrido(hs)}: dentro de la franja de 48 a 72 h. La decisión de progresar es del equipo tratante.`};
  return {cr, aplica:true, estado:"si", hs,
          txt:`Ventana cumplida: ${fmtTranscurrido(hs)} desde ${cr.espera.refTxt}.`};
}

const TONO_ESPERA = {no:"crit", parcial:"warn", si:"ok", sindato:"warn"};

function tarjetaCriterios(p, compacta){
  const e = estadoEspera(p);
  const cr = e.cr;
  const tonoEsp = e.aplica ? TONO_ESPERA[e.estado] : "ok";

  const cabecera = `
    <div class="crit-head">
      <span class="crit-tag">${esc(cr.etiqueta)}</span>
      ${cr.indefinido ? '<span class="pill warn">Falta definir el tipo de ACV</span>' : ""}
    </div>
    <div class="crit-pa">
      <div class="crit-lim"><span class="cl-lab">PAS</span><span class="cl-val">&lt; ${cr.pas}</span><span class="cl-uni">mmHg</span></div>
      <div class="crit-lim"><span class="cl-lab">PAD</span><span class="cl-val">&lt; ${cr.pad}</span><span class="cl-uni">mmHg</span></div>
      ${cr.espera ? `<div class="crit-lim ${tonoEsp}">
        <span class="cl-lab">Espera</span><span class="cl-val">${cr.espera.max ? cr.espera.min + "–" + cr.espera.max : cr.espera.min} h</span>
        <span class="cl-uni">desde ${esc(cr.espera.refTxt)}</span></div>` :
        `<div class="crit-lim"><span class="cl-lab">Espera</span><span class="cl-val">—</span><span class="cl-uni">sin ventana definida</span></div>`}
    </div>`;

  if(compacta) return `<div class="crit-box">${cabecera}
    ${e.aplica && e.estado !== "si" ? `<div class="alert ${tonoEsp}" style="margin-top:10px"><span>${esc(e.txt)}</span></div>` : ""}
  </div>`;

  return `<div class="crit-box">${cabecera}
    ${e.aplica ? `<div class="alert ${tonoEsp}" style="margin-top:12px"><span>
        <b>${e.estado === "si" ? "Ventana de espera cumplida" : e.estado === "no" ? "Ventana de espera no cumplida" :
            e.estado === "parcial" ? "Franja intermedia" : "Sin datos para calcular la ventana"}.</b><br>${esc(e.txt)}</span></div>` : ""}
    ${cr.nota ? `<p class="footnote" style="margin:10px 0 0">${esc(cr.nota)}</p>` : ""}
    <p class="footnote" style="margin:10px 0 0"><b>Origen:</b> protocolo de movilización del servicio UTAC. Los límites de presión y las ventanas de espera los define el servicio; esta pantalla solo aplica la regla que corresponde a este paciente. La decisión final es del equipo tratante.</p>
  </div>`;
}

function pillEspera(p){
  const e = estadoEspera(p);
  if(!e.aplica || e.estado === "si") return "";
  if(e.estado === "no")      return `<span class="pill crit">Espera ${fmtTranscurrido(e.cr.espera.min - e.hs)}</span>`;
  if(e.estado === "parcial") return `<span class="pill warn">48–72 h</span>`;
  return "";
}

function pillReperfusion(p){
  const tipo = p.reperfusion || "";
  if(!conTrombolisis(tipo) && !conTrombectomia(tipo)) return "";
  const hs = [conTrombolisis(tipo) && p.tlFecha ? horasDesde(p.tlFecha, p.tlHora) : null,
              conTrombectomia(tipo) && p.tmFecha ? horasDesde(p.tmFecha, p.tmHora) : null]
             .filter(x => x !== null && x >= 0).sort((a,b) => a-b)[0];
  const sigla = tipo === "Trombólisis + trombectomía (terapia puente)" ? "TL + TM"
              : (conTrombolisis(tipo) ? "TL" : "TM");
  if(hs !== undefined && hs < 24)
    return `<span class="pill crit">${sigla} hace ${fmtTranscurrido(hs)}</span>`;
  return `<span class="pill primary">${sigla}</span>`;
}
</script>

<script>
"use strict";

/* ============================================================
   COMPORTAMIENTO DE APLICACIÓN NATIVA
   ============================================================ */

/* --- 1. Persistencia del almacenamiento -------------------- */
let estadoPersistencia = {soportado:false, persistente:false, usoMB:null, cuotaMB:null};

async function asegurarPersistencia(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return;
    estadoPersistencia.soportado = true;
    let ok = await navigator.storage.persisted();
    if(!ok) ok = await navigator.storage.persist();
    estadoPersistencia.persistente = !!ok;
    if(navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      if(e.usage != null)  estadoPersistencia.usoMB   = e.usage / 1048576;
      if(e.quota != null)  estadoPersistencia.cuotaMB = e.quota / 1048576;
    }
  }catch(e){ /* el navegador no lo soporta: seguimos igual */ }
}

/* --- 4. Compartir o descargar el respaldo -------------------- */
function descargarArchivo(contenido, nombre, tipo){
  try{
    const url = URL.createObjectURL(new Blob([contenido], {type:tipo}));
    const a = el("a", {href:url, download:nombre});
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  }catch(e){ return false; }
}

async function compartirRespaldo(contenido, nombre, tipo, nodoMsg){
  const decir = (t, color) => { if(nodoMsg){ nodoMsg.textContent = t; nodoMsg.style.color = color; } };
  try{
    const archivo = new File([contenido], nombre, {type:tipo});
    if(navigator.canShare && navigator.canShare({files:[archivo]})){
      await navigator.share({files:[archivo], title:"Respaldo KineStroke"});
      marcarRespaldo();
      decir("Respaldo compartido ✓", "var(--ok)");
      vibrar();
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError"){ decir("", ""); return; }
  }
  if(descargarArchivo(contenido, nombre, tipo)){
    marcarRespaldo();
    decir("Archivo descargado ✓", "var(--ok)");
  } else {
    decir("Tu navegador no permite descargar aquí: copia el texto del cuadro.", "var(--warn)");
  }
}

/* --- 5. Recordatorio de respaldo ----------------------------- */
function marcarRespaldo(){ state.ultimoRespaldo = hoy(); guardar(); }
function diasSinRespaldo(){
  if(!state.patients.length || state.demo) return null;
  if(!state.ultimoRespaldo) return 999;
  const d = diasEntre(state.ultimoRespaldo, hoy());
  return d === null ? null : d;
}
function bannerRespaldo(){
  const d = diasSinRespaldo();
  if(d === null || d < 7) return "";
  const texto = d === 999
    ? "Todavía no has hecho ningún respaldo de los datos."
    : `Han pasado ${d} días desde tu último respaldo.`;
  return `<div class="alert warn no-print" style="align-items:center">
    <span style="flex:1">${texto} Los datos viven solo en este dispositivo: un respaldo semanal es lo único que los protege.</span>
    <button class="btn sm ghost" onclick="irA('datos')">Respaldar ahora</button>
  </div>`;
}

/* --- 6. Iconos de la barra inferior -------------------------- */
const ICONOS_NAV = {
  pacientes:'<path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 18h18M6 10V7a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v3"/>',
  paciente:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  evaluacion:'<path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M16 6h2a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/><path d="M8.5 13l2 2 4-4"/>',
  calculadora:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h.01M12 11h.01M15 11h.01M9 15h.01M12 15h.01M15 15v3M9 18h3"/>',
  referencia:'<path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h7M8 11h7"/>',
  datos:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'
};
function ponerIconosNav(){
  document.querySelectorAll(".nav button").forEach(b => {
    const p = ICONOS_NAV[b.dataset.view];
    if(!p || b.querySelector("svg")) return;
    b.insertAdjacentHTML("afterbegin",
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`);
  });
}
</script>

<script>
"use strict";

/* ============================================================
   VISTA · REFERENCIA
   ============================================================ */
function renderReferencia(){
  const v = $("#view-referencia");
  const tarjetas = ESCALAS_ORDEN.map(k => {
    const S = SCALES[k];
    const bandas = S.bandas.map((b,i) => {
      const prev = i === 0 ? (S.min || 0) : (S.bandas[i-1].max + (S.decimales ? 0.01 : 1));
      const hasta = b.max >= 1e8 ? "+" : String(b.max).replace(".", ",");
      const desde = String(+prev.toFixed(2)).replace(".", ",");
      return `<tr><td class="num">${desde} – ${hasta}</td><td><span class="pill ${b.tono}">${esc(b.txt)}</span></td></tr>`;
    }).join("");
    return `<div class="card">
      <div class="card-head">
        <h3>${S.sigla}</h3>
        <span class="small muted">${esc(S.nombre)}</span>
        <span class="spacer"></span>
        <span class="pill ${ESCALAS_PRINCIPALES.includes(k)?"primary":""}">${ESCALAS_PRINCIPALES.includes(k)?"Principal":"Complementaria"}</span>
      </div>
      <div class="card-pad">
        <p class="small" style="margin:0 0 10px">${esc(S.desc)}${S.tipo!=="tiempo" ? ` · ${S.items.length} ítems` : ""}</p>

function csvDeTodo(){
  const cols = ["paciente","cama","edad","sexo","tipo_acv","clasificacion","lado","nihss_ingreso","fecha_ingreso",
    "reperfusion","inicio_sintomas","hora_trombolisis","hora_trombectomia",
    "fecha_eval","momento","evaluador","pas","pad","fc","spo2","fr"]
    .concat(ESCALAS_ORDEN.map(k => SCALES[k].sigla.toLowerCase()))
    .concat(["carga_puntos","carga_categoria","observaciones"]);
  const filas = [cols.join(";")];
  state.patients.forEach(p => {
    evalsOrdenadas(p).forEach(ev => {
      const v = ev.vitals || {};
      const base = [p.iniciales, p.cama, p.edad, p.sexo, p.tipoACV, p.subtipo, p.ladoAfectado, p.nihss, p.fechaIngreso,
        p.reperfusion||"", (p.inicioFecha ? fmtMomento(p.inicioFecha,p.inicioHora) : ""),
        (p.tlFecha ? fmtMomento(p.tlFecha,p.tlHora) : ""), (p.tmFecha ? fmtMomento(p.tmFecha,p.tmHora) : ""),
        ev.fecha, ev.tipo, ev.evaluador || "", v.pas||"", v.pad||"", v.fc||"", v.spo2||"", v.fr||""];
      const sc = ESCALAS_ORDEN.map(k => {
        const t = totalEscala(k, (ev.scales||{})[k]);
        return t === null ? "" : String(t).replace(".", ",");
      });
      const rc = calcularCarga(ev);
      const fila = base.concat(sc, [rc.total, rc.cat.nombre, (ev.notas||"").replace(/[\r\n;]+/g, " ")]);
      filas.push(fila.map(x => String(x == null ? "" : x)).join(";"));
    });
  });
  return filas.join("\n");
}

function importar(reemplazar){
  const msg = $("#impMsg");
  try{
    const data = JSON.parse($("#impBox").value);
    const nuevos = Array.isArray(data) ? data : (data.patients || []);
    if(!nuevos.length) throw new Error("sin pacientes");
    if(reemplazar) state.patients = nuevos;
    else {
      const ids = new Set(state.patients.map(p => p.id));
      nuevos.forEach(p => { if(ids.has(p.id)) p.id = uid(); state.patients.push(p); });
    }
    state.demo = false;
    guardar();
    msg.textContent = `${nuevos.length} paciente(s) importado(s).`;
    msg.style.color = "var(--ok)";
    setTimeout(() => irA("pacientes"), 700);
  }catch(e){
    msg.textContent = "No se pudo leer el respaldo: revisa que sea un JSON completo.";
    msg.style.color = "var(--crit)";
  }
}

async function copiar(texto, nodoMsg){
  try{
    await navigator.clipboard.writeText(texto);
    if(nodoMsg){ nodoMsg.textContent = "Copiado ✓"; nodoMsg.style.color = "var(--ok)"; }
  }catch(e){
    if(nodoMsg){ nodoMsg.textContent = "Selecciona el texto y copia con Ctrl/Cmd + C"; nodoMsg.style.color = "var(--warn)"; }
  }
  setTimeout(() => { if(nodoMsg) nodoMsg.textContent = ""; }, 3500);
}

/* ============================================================
   RESUMEN PARA LA FICHA CLÍNICA
   ============================================================ */
function textoResumen(p){
  const evs = evalsOrdenadas(p);
  const u = evs[evs.length-1];
  if(!u) return "Sin evaluaciones registradas.";
  const prim = evs[0];
  const v = u.vitals || {};
  const L = [];
  L.push(`KINESIOLOGÍA · UTAC — Evaluación ${u.tipo.toLowerCase()}`);
  L.push(`Paciente: ${p.iniciales || "—"} · Cama ${p.cama || "—"}${p.edad ? ` · ${p.edad} años` : ""}`);
  L.push(`Diagnóstico: ${p.tipoACV || "ACV por precisar"}${p.subtipo && p.subtipo!=="No aplica / por precisar" ? `, ${p.subtipo}` : ""}${p.ladoAfectado && p.ladoAfectado!=="Sin compromiso motor" ? `, compromiso ${p.ladoAfectado.toLowerCase()}` : ""}${p.nihss !== "" && p.nihss != null ? ` · NIHSS ingreso ${p.nihss}` : ""}`);
  if(p.reperfusion && p.reperfusion !== "Se desconoce"){
    const partes = [p.reperfusion];
    if(conTrombolisis(p.reperfusion) && p.tlFecha)  partes.push(`trombólisis ${fmtMomento(p.tlFecha, p.tlHora)}`);
    if(conTrombectomia(p.reperfusion) && p.tmFecha) partes.push(`trombectomía ${fmtMomento(p.tmFecha, p.tmHora)}`);
    if(p.inicioFecha) partes.push(`inicio de síntomas ${fmtMomento(p.inicioFecha, p.inicioHora)}`);
    L.push(`Reperfusión: ${partes.join(" · ")}.`);
  }
  L.push(`Fecha de evaluación: ${fFecha(u.fecha)}${p.fechaIngreso ? ` (día ${diasEntre(p.fechaIngreso, u.fecha)} de hospitalización)` : ""}`);
  L.push("");
  L.push(`Signos vitales previos a la sesión: PA ${v.pas||"—"}/${v.pad||"—"} mmHg · FC ${v.fc||"—"} lpm · SpO2 ${v.spo2||"—"}% · FR ${v.fr||"—"} rpm`);
  const alertas = evaluarVitales(v, p);
  if(alertas.length) L.push(`Alertas: ${alertas.map(a => a.txt).join("; ")}.`);
  const crm = criteriosMovilizacion(p);
  const esp = estadoEspera(p);
  L.push(`Criterios de movilización aplicables (${crm.etiqueta}): PAS < ${crm.pas} mmHg, PAD < ${crm.pad} mmHg${crm.espera ? `, espera de ${crm.espera.texto}` : ""}.`);
  if(esp.aplica) L.push(`  ${esp.txt}`);
  L.push("");
  const rc = calcularCarga(u);
  L.push(`Categorización de carga de rehabilitación (protocolo UTAC): ${rc.total} puntos de 12 → ${rc.cat.nombre.toUpperCase()}.`);
  L.push(`  Detalle: ${rc.detalle.map(x => `${x.sigla} ${x.valor !== null ? fmtTotal(x.key, x.valor) : (x.noAplica ? "no aplicada" : "incompleta")} = ${x.puntos} pto${x.puntos>1?"s":""}`).join(" · ")}.`);
  L.push("");
  L.push("Escalas aplicadas:");
  ESCALAS_ORDEN.forEach(k => {
    const reg = (u.scales||{})[k];
    if(!reg) return;
    const t = totalEscala(k, reg);
    if(t === null){
      if(reg.noEval) L.push(`- ${SCALES[k].sigla}: no se aplica${reg.motivo ? ` (${reg.motivo})` : ""}.`);
      return;
    }
    const band = interpretar(k, t);
    const t0 = prim !== u ? totalEscala(k, (prim.scales||{})[k]) : null;
    const comp = t0 !== null ? ` — ingreso ${fmtTotal(k,t0)}, variación ${(t-t0) > 0 ? "+" : ""}${String(+(t-t0).toFixed(1)).replace(".",",")}` : "";
    const extra = k === "tug" && reg.ayuda && reg.ayuda !== "Ninguna" ? ` (con ${reg.ayuda.toLowerCase()})` : "";
    L.push(`- ${SCALES[k].sigla} ${fmtTotal(k,t)}${SCALES[k].tipo!=="tiempo" ? `/${SCALES[k].max}` : ""}${extra}: ${band.txt}${comp}.`);
  });
  if(u.notas){ L.push(""); L.push(`Observaciones: ${u.notas}`); }
  if(u.evaluador){ L.push(""); L.push(`Evaluó: ${u.evaluador}`); }
  return L.join("\n");
}

function mostrarResumen(p){
  const texto = textoResumen(p);
  const bg = el("div", {className:"modal-bg"});
  bg.innerHTML = `<div class="modal">
    <div class="card-head"><h2>Resumen para la ficha clínica</h2><span class="spacer"></span><button class="icon-btn" data-cerrar>Cerrar</button></div>

      <textarea class="copybox" id="resBox" style="min-height:290px">${esc(texto)}</textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" data-copiar>Copiar texto</button>
        <button class="btn ghost sm" onclick="window.print()">Imprimir ficha</button>
        <span class="small muted" id="resMsg"></span>
      </div>
      <p class="footnote" style="margin:10px 0 0">Revisa el texto antes de pegarlo: la app resume lo registrado, la redacción clínica final es tuya.</p>
    </div>
  </div>`;
  bg.addEventListener("click", (e) => {
    if(e.target === bg || e.target.hasAttribute("data-cerrar")) bg.remove();
    if(e.target.hasAttribute("data-copiar")) copiar($("#resBox", bg).value, $("#resMsg", bg));
  });
  document.body.appendChild(bg);
}

/* ---- icono de la aplicación para la pantalla de inicio del teléfono ---- */
function almacenamientoDisponible(){
  try{
    const k = "__kinestroke_test__";
    localStorage.setItem(k, "1");
    const ok = localStorage.getItem(k) === "1";
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}

function avisoSinAlmacenamiento(){
  if(almacenamientoDisponible()) return;
  const aviso = el("div");
  aviso.className = "alert crit";
  aviso.style.cssText = "margin:0 16px 12px; border-radius:10px; align-items:flex-start";
  aviso.innerHTML = `<span><b>Este navegador no está guardando los datos.</b><br>
    Lo que registres aquí se perderá al cerrar la aplicación. Ocurre al abrir el archivo directamente
    desde el teléfono o en una ventana privada. Ábrela desde el enlace web y agrégala a la pantalla de
    inicio, o usa un computador. Mientras tanto, exporta el respaldo antes de cerrar.</span>`;
  const main = document.querySelector("main");
  main.insertBefore(aviso, main.firstChild);
}

/* Con dirección propia (GitHub Pages u otro alojamiento) la app se guarda
   en el dispositivo y abre sin conexión. En el visor de Claude no aplica. */
function registrarServicioOffline(){
  try{
    if(!("serviceWorker" in navigator)) return;
    if(!/^https?:$/.test(location.protocol)) return;
    if(window.self !== window.top) return;
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }catch(e){}
}

function registrarIcono(){
  const img = document.getElementById("brandIcon");
  if(!img) return;
  const src = img.getAttribute("src");
  const yaHayManifiesto = !!document.querySelector('link[rel="manifest"]');
  [["apple-touch-icon", null], ["icon", "image/png"], ["shortcut icon", "image/png"]].forEach(([rel, tipo]) => {
    const l = document.createElement("link");
    l.rel = rel; l.href = src;
    if(tipo) l.type = tipo;
    document.head.appendChild(l);
  });
  if(yaHayManifiesto) { ponerThemeColor(); return; }
  try{
    const manifiesto = {
      name:"KineStroke — Escalas ACV · UTAC", short_name:"KineStroke",
      start_url:".", display:"standalone",
      background_color:"#F3F6FB", theme_color:"#9C27B0",
      icons:[{src:src, sizes:"384x384", type:"image/png", purpose:"any maskable"}]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifiesto)], {type:"application/manifest+json"}));
    const m = document.createElement("link");
    m.rel = "manifest"; m.href = url;
    document.head.appendChild(m);
  }catch(e){}
  ponerThemeColor();
}
function ponerThemeColor(){
  if(document.querySelector('meta[name="theme-color"]')) return;
  const meta = document.createElement("meta");
  meta.name = "theme-color"; meta.content = "#9C27B0";
  document.head.appendChild(meta);
}

(function init(){
  registrarServicioOffline();
  registrarIcono();
  avisoSinAlmacenamiento();
  asegurarPersistencia();
  ponerIconosNav();
  if(!cargar() || !state.patients.length) sembrarDemo();
  migrarMRC();

  $("#btnNuevoPaciente").onclick = () => nuevoPaciente();
  $("#btnBorrarDemo").onclick = () => {
    state.patients = state.patients.filter(p => !String(p.id).startsWith("demo"));
    state.demo = false; guardar(); renderCamas();
  };
  document.querySelectorAll(".nav button").forEach(b => {
    b.onclick = () => {
      if(b.dataset.view === "evaluacion" && !ui.pid && state.patients.length) ui.pid = state.patients[0].id;
      irA(b.dataset.view);
    };
  });

  ui.pid = state.patients.length ? state.patients[0].id : null;
  irA("pacientes");
})();
